name: Weltkugel-Daten

# Daten-Update für die Weltkugel, kein Terminal-Bau (den übernimmt terminal.yml, nur wenn sich Daten geändert haben).
#  - täglich 06:17 UTC: Meldungen zu Störungen an Engstellen der Handelsrouten -> app/data/news_routen.json
#    (GDELT, bei Drosselung Google News RSS; beide kostenlos, ohne Schlüssel)
#    und Zinsen, Devisen, Rohstoffe, Börsenplätze (BIS, OECD, EZB, FRED) -> app/data/boerse_welt.json
#    und Regierungen, Wahlkalender (auch "gerade gewählt") -> app/data/politik.json,
#    nationale Parlamente aller Staaten (IPU Parline, Wikipedia, Wikidata) -> app/data/parlamente.json (rund 6 Minuten)
#    und daraus das einheitliche Wahlregister (alle Ebenen) -> app/data/wahlen.json
#  - Mo 04:23 UTC: Weltbank-Kennzahlen, Eurostat-Strom, US-Zollbelastung, Wirtschaftsräume -> app/data/welt.json
#    und Regierungen, Wahlkalender, Bundesländer, Umfragen (Wikidata, Wikipedia, Bundeswahlleiterin, DAWUM) -> app/data/politik.json
#    und Parlamente samt Gliedstaaten der Bundesstaaten -> app/data/parlamente.json (rund 15 Minuten; Wahlartikel im Cache
#    app/data/parlamente_wahlcache.json, der erste Lauf ohne Cache dauert rund 30 Minuten)
#    und physikalische Stromflüsse je Grenze und Monat (ENTSO-E) -> app/data/strom_entsoe.json, nur wenn das Repository-Secret
#    ENTSOE_API_KEY gesetzt ist (rund 5 Minuten; der Schlüssel steht nur im Secret, nie im Repo oder Log)
# Fällt eine Quelle aus, bleibt der letzte gute Stand liegen.
# Kosten: keine. Meldungen rund 15 Minuten (Abstände wegen der Abfragegrenzen), Weltdaten rund 3 Minuten.
on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      was:
        description: "Was abrufen?"
        type: choice
        options: [meldungen, weltdaten, beides]
        default: meldungen

permissions:
  contents: write
  actions: write

# gemeinsame Sperre mit den anderen Daten-Workflows: nie zwei Läufe gleichzeitig am Daten-Branch
concurrency:
  group: daten-schreiben
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  abruf:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      WAS: ${{ github.event_name == 'schedule' && (github.event.schedule == '23 4 * * 1' && 'weltdaten' || 'meldungen') || inputs.was }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !*.pdf
            !*.gz
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Meldungen zu Routenstörungen
        if: env.WAS == 'meldungen' || env.WAS == 'beides'
        run: |
          python3 app/news_routen.py 2>&1 | tee /tmp/news.log
          python3 app/boerse_welt.py 2>&1 | tee -a /tmp/news.log
          python3 app/finanz_makro.py 2>&1 | tee -a /tmp/news.log
      - name: Wahlkalender und nationale Parlamente (täglich, damit "gerade gewählt" aktuell bleibt)
        if: env.WAS == 'meldungen'
        run: |
          python3 app/politik_daten.py 2>&1 | tee /tmp/parl.log
          python3 app/parlamente_daten.py --nur-national 2>&1 | tee -a /tmp/parl.log
          python3 app/wahlen_daten.py --ohne-abruf 2>&1 | tee -a /tmp/parl.log
          python3 app/wahlabdeckung.py 2>&1 | tee -a /tmp/parl.log
      - name: Weltbank, Strom, Zölle, Wirtschaftsräume
        if: env.WAS == 'weltdaten' || env.WAS == 'beides'
        run: |
          python3 app/welt_daten.py 2>&1 | tee /tmp/welt.log
          python3 app/politik_daten.py 2>&1 | tee -a /tmp/welt.log
          python3 app/parlamente_daten.py 2>&1 | tee /tmp/parl.log
          python3 app/wahlen_daten.py --ohne-abruf 2>&1 | tee -a /tmp/parl.log
          python3 app/wahlabdeckung.py 2>&1 | tee -a /tmp/parl.log
      - name: Stromflüsse ENTSO-E (nur mit Secret ENTSOE_API_KEY)
        if: env.WAS == 'weltdaten' || env.WAS == 'beides'
        continue-on-error: true
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          if [ -z "$ENTSOE_API_KEY" ]; then echo "Secret ENTSOE_API_KEY fehlt, Stromflüsse übersprungen" | tee -a /tmp/welt.log; exit 0; fi
          python3 app/entsoe_abruf.py 2>&1 | tail -n 5 | tee -a /tmp/welt.log
      - name: Zusammenfassung
        if: always()
        continue-on-error: true
        run: |
          {
            echo "### Weltkugel-Daten ($WAS)"
            for f in /tmp/news.log /tmp/welt.log /tmp/parl.log; do
              [ -f "$f" ] || continue
              echo '```'; tail -n 3 "$f"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      # Schreiben nur auf main: ein Start von einem anderen Branch ist ein Trockenlauf
      - name: Änderungen pushen
        id: push
        if: github.ref == 'refs/heads/main'
        run: .github/scripts/daten_pushen.sh "Weltkugel-Daten $(date -u +%Y-%m-%d) ($WAS)" app/data/news_routen.json app/data/welt.json app/data/boerse_welt.json app/data/finanz_makro.json app/data/politik.json app/data/parlamente.json app/data/parlamente_wahlcache.json app/data/wahlen.json wahlen/abdeckung.csv app/data/strom_entsoe.json
      - name: Terminal neu bauen lassen
        if: github.ref == 'refs/heads/main' && steps.push.outputs.geaendert == 'true'
        run: gh workflow run terminal.yml --ref "$GITHUB_REF_NAME"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
