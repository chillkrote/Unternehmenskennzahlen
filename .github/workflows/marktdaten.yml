name: Börsendaten Terminal

# Daten-Update, kein Terminal-Bau (den übernimmt terminal.yml, nur wenn sich Daten geändert haben).
#  - Mo-Fr 18:30 UTC (nach Xetra-Schluss): Tageskurse der Banken, Kennzahlen -> app/data/markt.json
#  - Sa 05:00 UTC: Wochenkurse (zehn Jahre) aller Börsenunternehmen -> app/data/kurse_woche.json
#  - Mo-Fr 22:00 UTC (nach US-Handelsschluss): Bereich BÖR, Aktienindizes weltweit und große Unternehmen -> app/data/boerse.json
# Fällt Yahoo teilweise aus (429), bleibt der letzte gute Stand liegen; der Lauf scheitert dann nicht.
# Kosten: keine. Rund 3 Minuten je Lauf, Schätzung siehe .github/workflows/README.md
on:
  schedule:
    - cron: "30 18 * * 1-5"
    - cron: "0 5 * * 6"
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
    inputs:
      was:
        description: "Was abrufen?"
        type: choice
        options: [kurse, wochenkurse, boerse, beides]
        default: kurse

permissions:
  contents: write
  actions: write

# gemeinsame Sperre mit termine.yml: nie zwei Läufe gleichzeitig am Daten-Branch
concurrency:
  group: daten-schreiben
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  abruf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WAS: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 5 * * 6' && 'wochenkurse' || github.event.schedule == '0 22 * * 1-5' && 'boerse' || 'kurse') || inputs.was }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !*.pdf
            !*.gz
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - name: Tageskurse
        if: env.WAS == 'kurse' || env.WAS == 'beides'
        run: python3 app/marktdaten.py | tee /tmp/markt.log
      - name: Wochenkurse
        if: env.WAS == 'wochenkurse' || env.WAS == 'beides'
        run: python3 app/kurse_historie.py | tee /tmp/woche.log
      - name: Indizes und Weltunternehmen (BÖR)
        if: env.WAS == 'boerse' || env.WAS == 'beides'
        run: python3 app/boersen_abruf.py | tee /tmp/boerse.log
      - name: Zusammenfassung
        if: always()
        continue-on-error: true
        run: |
          {
            echo "### Börsendaten ($WAS)"
            for f in /tmp/markt.log /tmp/woche.log /tmp/boerse.log; do
              [ -f "$f" ] || continue
              echo '```'; grep -E "Banken mit Kursen|Ticker,|Indizes,|::warning::|Fehler" "$f" | head -5 || true; echo '```'
              echo "<details><summary>Ausfälle</summary>"; echo; echo '```'; grep -E "^   " "$f" | head -60 || true; echo '```'; echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      # Schreiben nur auf main: ein Start von einem anderen Branch ist ein Trockenlauf (Abruf und Zusammenfassung, kein Commit)
      - name: Änderungen pushen
        id: push
        if: github.ref == 'refs/heads/main'
        run: .github/scripts/daten_pushen.sh "Börsendaten $(date -u +%Y-%m-%d) ($WAS)" app/data/markt.json app/data/kurse_woche.json app/data/boerse.json
      - name: Terminal neu bauen lassen
        if: github.ref == 'refs/heads/main' && steps.push.outputs.geaendert == 'true'
        run: gh workflow run terminal.yml --ref "$GITHUB_REF_NAME"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
