name: Server (API-Tests)

# Backend der Plattform (server/): Migrationen und API gegen PostgreSQL 16 mit den echten Repo-Daten. Kein Netzwerkzugriff auf Datenanbieter.
on:
  pull_request:
    paths: ["server/**", "international/**", "stammdaten/**", "unternehmen-tabelle/**", "zeitreihen/*.csv", "app/register.py",
            "app/geo/laender.geojson", "app/data/unternehmen.json", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-nur-lokal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-nur-lokal@localhost:5432/postgres
    steps:
      # ohne die großen PDF-/HTML-Dokumente; die Tests brauchen nur Code, CSV und JSON
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !*.pdf
            !*.gz
            !*.html
            !*.htm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r server/requirements-dev.txt
      - run: python3 -m pytest -q
        working-directory: server
