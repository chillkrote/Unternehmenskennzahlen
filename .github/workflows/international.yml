name: International (Tests)

# Offline-Tests der internationalen Erweiterung gegen eine echte PostgreSQL-16-Instanz. Kein Netzwerkzugriff auf Datenanbieter.
on:
  pull_request:
    paths: ["international/**", "stammdaten/**", "unternehmen-tabelle/**", ".github/workflows/international.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-nur-lokal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      INTERNATIONAL_TEST_DATABASE_URL: postgresql://postgres:ci-nur-lokal@localhost:5432/postgres
    steps:
      # ohne die großen PDF-/HTML-Dokumente (mehrere GB); die Tests brauchen nur Code, CSV und JSON
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !*.pdf
            !*.gz
            !*.html
            !*.htm
      # pg_dump/pg_restore müssen zur Server-Version (16) passen: der Runner liefert einen neueren Client,
      # dessen Dump `SET transaction_timeout` enthält, das PostgreSQL 16 nicht kennt (test_backup_und_restore).
      - name: PostgreSQL-16-Client installieren
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r international/requirements.txt
      - run: python3 stammdaten/pruefe_ids.py
      - run: python3 international/international_core.py
      - run: python3 -m unittest discover -s international/tests -v
