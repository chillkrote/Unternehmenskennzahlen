<title>Bank-Terminal GJ 2025</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Layout: Terminal-Raster. Kommandozeile oben, Funktionstasten, darunter dichte Panels mit Titelleiste. Nur dunkel. */
:root {
  color-scheme: dark;
  --bg: #050608;          /* Bildschirm */
  --panel: #0c0e12;       /* Panel-Fläche */
  --line: #1e232b;        /* Raster, Rahmen */
  --grid: #171b21;        /* Diagramm-Gitter */
  --ink: #e9edf2;         /* Zahlen */
  --ink-2: #9aa4b1;       /* Beschriftung */
  --ink-3: #5f6875;       /* Hilfstext */
  --amber: #ffa828;       /* Terminal-Akzent: Labels, Kommandos */
  --amber-dim: #a86a10;
  --key: #f5c400;         /* Funktionstasten */
  --up: #3ecf6e;          /* über Anforderung / besser */
  --down: #ff5248;        /* unter Anforderung / schlechter */
  /* Gruppen (validiert gegen --bg, CVD-sicher) */
  --spk: #e8484f;
  --geno: #2f86dd;
  --lb: #17a88a;
  --priv: #9a6fe0;
  /* Struktur-Rampen (keine Gruppenfarben) */
  --s1: #39424f; --s2: #525d6c; --s3: #707c8c; --s4: #929dab;
  --c1: #7a4d08; --c2: #c27a0c; --c3: #ffb238;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --cond: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font: 12px/1.45 var(--mono); font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 28px; display: grid; gap: 10px; }
a { color: var(--amber); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--key); outline-offset: 1px; }

/* Kopf */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: grid; gap: 6px; padding-block: 4px 6px; border-bottom: 1px solid var(--line); }
.cmd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-family: var(--cond); font-weight: 600; letter-spacing: .06em; color: var(--bg); background: var(--amber); padding: 1px 8px; text-transform: uppercase; }
.cmdline { flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 6px; background: #000; border: 1px solid var(--line); padding: 3px 8px; }
.cmdline span { color: var(--amber); }
.cmdline input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--key); text-transform: uppercase; }
.meta { color: var(--ink-3); white-space: nowrap; }
.keys { display: flex; gap: 4px; flex-wrap: wrap; }
.key { display: inline-flex; gap: 6px; align-items: baseline; background: #15181d; border: 1px solid var(--line); padding: 2px 8px; cursor: pointer; color: var(--ink-2); }
.key b { color: var(--bg); background: var(--key); padding: 0 4px; font-weight: 600; }
.key[aria-current="page"] { border-color: var(--amber); color: var(--amber); }
.key:hover { color: var(--ink); }

/* Ticker: Gruppenmediane */
.tape { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.tape > div { background: var(--panel); padding: 5px 8px; display: grid; gap: 1px; }
.tape .g { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-family: var(--cond); text-transform: uppercase; letter-spacing: .05em; }
.tape .row { display: flex; justify-content: space-between; gap: 8px; }
.tape .row span { color: var(--ink-3); }
.sw { width: 8px; height: 8px; display: inline-block; flex: none; }

/* Panels */
.grid { display: grid; gap: 10px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.p { grid-column: span 12; background: var(--panel); border: 1px solid var(--line); min-width: 0; display: flex; flex-direction: column; }
@media (min-width: 980px) { .w6 { grid-column: span 6; } .w7 { grid-column: span 7; } .w5 { grid-column: span 5; } .w4 { grid-column: span 4; } .w8 { grid-column: span 8; } }
.ph { display: flex; align-items: baseline; gap: 10px; padding: 4px 8px; border-bottom: 1px solid var(--line); background: #10141a; flex-wrap: wrap; }
.ph h2 { margin: 0; font: 600 12px/1.3 var(--cond); letter-spacing: .07em; text-transform: uppercase; color: var(--amber); }
.ph .code { color: var(--key); }
.ph .sub { color: var(--ink-3); flex: 1 1 200px; }
.pb { padding: 8px; min-width: 0; }
.foot { padding: 4px 8px 6px; color: var(--ink-3); border-top: 1px dashed var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--ink-2); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.ctrl { display: flex; gap: 4px; flex-wrap: wrap; }
.ctrl button, .chip { background: #15181d; border: 1px solid var(--line); padding: 1px 7px; cursor: pointer; color: var(--ink-2); }
.ctrl button[aria-pressed="true"] { color: var(--bg); background: var(--amber); border-color: var(--amber); }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: var(--mono); font-size: 10.5px; fill: var(--ink-2); }
svg .ax { stroke: var(--line); }
svg .gl { stroke: var(--grid); }
.scroll { overflow-x: auto; }

/* Tabellen */
table { border-collapse: collapse; width: 100%; white-space: nowrap; font: inherit; }
th, td { padding: 2px 8px; text-align: right; border-bottom: 1px solid #12161b; }
th { color: var(--amber); font-weight: 500; position: sticky; top: 0; background: #10141a; cursor: default; }
th.sortable { cursor: pointer; }
th:first-child, td:first-child { text-align: left; }
tbody tr:hover td { background: #141a22; }
td.n { color: var(--ink-3); }
.pos { color: var(--up); } .neg { color: var(--down); }
.pct { color: var(--ink-3); font-size: 10.5px; }
.tblwrap { max-height: 560px; overflow: auto; }
tr.click { cursor: pointer; }

/* Vergleich */
.picks { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.chip button { background: none; border: 0; color: var(--ink-3); cursor: pointer; padding: 0 2px; }
.chip button:hover { color: var(--down); }
.picks input { background: #000; border: 1px solid var(--line); padding: 1px 6px; min-width: 0; width: 280px; max-width: 100%; color: var(--key); }

#tip { position: fixed; z-index: 20; pointer-events: none; background: #000; border: 1px solid var(--amber-dim); padding: 4px 7px; color: var(--ink); max-width: 320px; white-space: pre-line; display: none; }
#tip b { color: var(--amber); font-weight: 500; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="cmd">
      <span class="brand">BKT</span>
      <label class="cmdline" for="cmd"><span>&gt;</span><input id="cmd" placeholder="GRP · QUOT · CMP · RANK · oder Bankname, dann Enter" autocomplete="off" list="banklist"></label>
      <span class="meta" id="meta"></span>
    </div>
    <nav class="keys" aria-label="Funktionen">
      <a class="key" href="#grp" data-v="grp"><b>F1</b>GRP Gruppen</a>
      <a class="key" href="#quot" data-v="quot"><b>F2</b>QUOT Quoten</a>
      <a class="key" href="#cmp" data-v="cmp"><b>F3</b>CMP Einzelbanken</a>
      <a class="key" href="#rank" data-v="rank"><b>F4</b>RANK Liste</a>
    </nav>
  </header>
  <section class="tape" id="tape" aria-label="Gruppenmediane"></section>
  <main id="view"></main>
</div>
<datalist id="banklist"></datalist>
<div id="tip" role="tooltip"></div>

<script id="daten" type="application/json">__DATEN__</script>
<script>
"use strict";
const GRUPPEN = [
  { id: "Sparkassen", kurz: "SPK", farbe: "var(--spk)" },
  { id: "Genossenschaftsbanken", kurz: "GENO", farbe: "var(--geno)" },
  { id: "Landesbanken", kurz: "LB", farbe: "var(--lb)" },
  { id: "Private Banken", kurz: "PRIV", farbe: "var(--priv)" },
];
const G = Object.fromEntries(GRUPPEN.map(g => [g.id, g]));
let DATA, BANKEN;

/* ---------- Formatierung ---------- */
const nf = d => new Intl.NumberFormat("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });
const f0 = nf(0), f1 = nf(1), f2 = nf(2);
const mio = v => v == null ? "n. v." : f0.format(v);
const pct = (v, d = 1) => v == null ? "n. v." : nf(d).format(v * 100) + " %";
const pp = v => v == null ? "n. v." : (v > 0 ? "+" : "") + f2.format(v) + " Pp.";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const kurz = n => n.replace(/\s*\(.*?\)\s*/g, " ").replace(/ Girozentrale| Aktiengesellschaft/g, "").trim();

/* ---------- Statistik ---------- */
const vals = (arr, k) => arr.map(b => typeof k === "function" ? k(b) : b[k]).filter(v => v != null && isFinite(v));
function quant(xs, q) { if (!xs.length) return null; const s = [...xs].sort((a, b) => a - b); const i = (s.length - 1) * q, lo = Math.floor(i); return s[lo] + (s[Math.ceil(i)] - s[lo]) * (i - lo); }
const median = xs => quant(xs, .5);
const sum = xs => xs.reduce((a, b) => a + b, 0);
function perzentil(v, xs) { if (v == null || !xs.length) return null; return xs.filter(x => x < v).length / Math.max(1, xs.length - 1); }
const kern = b => b.rolle !== "Zusatz";           // Zusatzeinträge (DZ, Deka, DKB) nicht in Gruppenwerte
const inGruppe = gid => BANKEN.filter(b => b.gruppe === gid && kern(b));

/* ---------- Kennzahlen ---------- */
const KZ = {
  cet1_quote: { name: "CET1-Quote", f: v => pct(v, 2), hoch: true, quelle: "KM1" },
  gk_quote: { name: "Gesamtkapitalquote", f: v => pct(v, 2), hoch: true, quelle: "KM1" },
  gk_puffer_pp: { name: "Puffer über SREP+KPA", f: pp, hoch: true, quelle: "KM1" },
  lr: { name: "Leverage Ratio", f: v => pct(v, 2), hoch: true, quelle: "KM1" },
  rwa_dichte: { name: "RWA-Dichte", f: v => pct(v, 1), hoch: false, quelle: "KM1 / HGB-BS" },
  ek_quote: { name: "EK-Quote (bilanziell)", f: v => pct(v, 2), hoch: true, quelle: "HGB" },
  ek_fonds_quote: { name: "EK-Quote inkl. Fonds § 340g", f: v => pct(v, 2), hoch: true, quelle: "HGB" },
  fonds_bs: { name: "Fonds § 340g in % BS", f: v => pct(v, 2), hoch: true, quelle: "HGB" },
  fonds_cet1: { name: "Fonds § 340g in % CET1", f: v => pct(v, 1), hoch: null, quelle: "HGB / KM1" },
  bs: { name: "Bilanzsumme (Mio. €)", f: mio, hoch: null, quelle: "HGB" },
};
function abgeleitet(b) {
  b.fonds_cet1 = b.fonds != null && b.cet1 ? b.fonds / b.cet1 : null;
  b.bs_zr = b.zeitreihe && b.zeitreihe.Bilanzsumme || {};
  return b;
}

/* ---------- Passiv- und Kapitalstruktur ---------- */
const PASSIV = [
  { k: "ki", name: "Verb. ggü. Kreditinstituten", farbe: "var(--s1)", re: /Kreditinstitut/ },
  { k: "kunden", name: "Verb. ggü. Kunden", farbe: "var(--s2)", re: /Kunden/ },
  { k: "verbr", name: "Verbriefte Verb.", farbe: "var(--s3)", re: /Verbriefte/ },
  { k: "sonst", name: "Sonstige Passiva", farbe: "var(--s4)", re: null },
  { k: "nachr", name: "Nachrang, Genussr., AT1", farbe: "var(--c1)", re: /Nachrang|Genussrecht|zusätzlichen aufsichtsrechtlichen/ },
  { k: "fonds", name: "Fonds § 340g", farbe: "var(--c2)", re: /Fonds für allgemeine/ },
  { k: "ek", name: "Eigenkapital", farbe: "var(--c3)", re: /Eigenkapital/ },
];
function passivStruktur(b) {
  if (!b.bilanz) return null;
  const out = Object.fromEntries(PASSIV.map(p => [p.k, 0]));
  for (const [pos, v] of Object.entries(b.bilanz.passiva)) {
    if (!v) continue;
    const p = PASSIV.find(p => p.re && p.re.test(pos)) || PASSIV.find(p => p.k === "sonst");
    out[p.k] += v;
  }
  return out;
}
const CC1 = [
  { k: "cc1_instrumente", name: "Kapitalinstrumente / Geschäftsguthaben", farbe: "var(--s2)" },
  { k: "cc1_gewinnrl", name: "Gewinnrücklagen", farbe: "var(--s4)" },
  { k: "cc1_fonds", name: "Fonds allg. Bankrisiken (EU-3a)", farbe: "var(--c3)" },
  { k: "cc1_oci", name: "OCI, sonstige Rücklagen", farbe: "var(--s1)" },
];
const OV1 = [
  { k: "ov1_kredit", name: "Kreditrisiko", farbe: "var(--s2)" },
  { k: "ov1_markt_alle", name: "Markt, CCR, CVA", farbe: "var(--s4)" },
  { k: "ov1_verbr", name: "Verbriefungen", farbe: "var(--s1)" },
  { k: "ov1_oprisk", name: "Operationelles Risiko", farbe: "var(--c2)" },
  { k: "ov1_rest", name: "Output Floor, Sonstiges", farbe: "var(--c3)" },
];
function ov1(b) {
  if (b.ov1_rwa == null) return null;
  const n = k => b[k] || 0;
  const r = { ov1_kredit: n("ov1_kredit"), ov1_markt_alle: n("ov1_markt") + n("ov1_ccr") + n("ov1_cva"), ov1_verbr: n("ov1_verbr"), ov1_oprisk: n("ov1_oprisk") };
  r.ov1_rest = Math.max(0, b.ov1_rwa - sum(Object.values(r)));
  return r;
}

/* ---------- Tooltip ---------- */
const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.innerHTML = t.getAttribute("data-tip");
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - w - 8) + "px";
  tip.style.top = (e.clientY + 16 + h > innerHeight ? e.clientY - h - 10 : e.clientY + 16) + "px";
});

/* ---------- SVG-Bausteine ---------- */
function panel({ code, titel, sub = "", breite = "", body, fuss = "" }) {
  return `<section class="p ${breite}"><div class="ph"><h2><span class="code">${code}</span> ${esc(titel)}</h2><span class="sub">${sub}</span></div><div class="pb">${body}</div>${fuss ? `<div class="foot">${fuss}</div>` : ""}</section>`;
}
const legende = items => `<div class="legend">${items.map(i => `<span><i class="sw" style="background:${i.farbe}"></i>${esc(i.name)}</span>`).join("")}</div>`;

/* 100-%-Balken: zeilen = [{label, farbe?, teile:{k:v}, tip}] */
function stapel100(zeilen, teile, { labelBreite = 150, hz = 22, zeigeWerte = true } = {}) {
  const W = 720, x0 = labelBreite, x1 = W - 8, h = zeilen.length * hz + 22;
  let s = `<svg viewBox="0 0 ${W} ${h}" role="img">`;
  for (let p = 0; p <= 100; p += 25) { const x = x0 + (x1 - x0) * p / 100; s += `<line class="gl" x1="${x}" x2="${x}" y1="0" y2="${h - 18}"/><text x="${x}" y="${h - 5}" text-anchor="middle">${p} %</text>`; }
  zeilen.forEach((z, i) => {
    const y = i * hz + 3, tot = sum(teile.map(t => z.teile[t.k] || 0));
    s += `<text x="${x0 - 8}" y="${y + hz / 2 + 1}" text-anchor="end" dominant-baseline="middle" style="fill:var(--ink)">${esc(z.label)}</text>`;
    if (z.farbe) s += `<rect x="${x0 - 6}" y="${y + 3}" width="3" height="${hz - 9}" fill="${z.farbe}"/>`;
    if (!tot) { s += `<text x="${x0 + 4}" y="${y + hz / 2 + 1}" dominant-baseline="middle" style="fill:var(--ink-3)">n. v.</text>`; return; }
    let x = x0;
    teile.forEach(t => {
      const v = z.teile[t.k] || 0; if (v <= 0) return;
      const w = (x1 - x0) * v / tot, anteil = v / tot;
      const tt = `<b>${esc(z.label)}</b>\n${esc(t.name)}: ${pct(anteil)}${z.einheit === "mio" ? `\n${mio(v)} Mio. €` : ""}`;
      s += `<rect x="${x + 1}" y="${y + 2}" width="${Math.max(0, w - 2)}" height="${hz - 7}" fill="${t.farbe}" data-tip="${esc(tt)}"/>`;
      if (zeigeWerte && w > 34) s += `<text x="${x + w / 2}" y="${y + hz / 2}" text-anchor="middle" dominant-baseline="middle" style="fill:#050608;font-size:10px;pointer-events:none">${f0.format(anteil * 100)}</text>`;
      x += w;
    });
  });
  return s + "</svg>";
}

/* ---------- Ansicht GRP ---------- */
function viewGrp() {
  // Kennzahlentabelle
  const zeilen = [["Banken in Liste", g => inGruppe(g).length, f0.format],
    ["Σ Bilanzsumme (Mio. €)", g => sum(vals(inGruppe(g), "bs")), mio],
    ["EK-Quote, Median", g => median(vals(inGruppe(g), "ek_quote")), v => pct(v, 2)],
    ["Fonds § 340g in % BS, Median", g => median(vals(inGruppe(g), "fonds_bs")), v => pct(v, 2)],
    ["EK + Fonds in % BS, Median", g => median(vals(inGruppe(g), "ek_fonds_quote")), v => pct(v, 2)],
    ["Anteil Fonds an Δ (EK+Fonds) 24→25", g => { const b = inGruppe(g).filter(b => b.ek != null && b.vj_ek != null && b.fonds != null && b.vj_fonds != null); const df = sum(b.map(x => x.fonds - x.vj_fonds)), de = sum(b.map(x => x.ek - x.vj_ek)); return df + de ? df / (df + de) : null; }, v => pct(v, 0)],
    ["CET1-Quote, Median (KM1)", g => median(vals(inGruppe(g), "cet1_quote")), v => pct(v, 2)],
    ["Gesamtkapitalquote, Median", g => median(vals(inGruppe(g), "gk_quote")), v => pct(v, 2)],
    ["Leverage Ratio, Median", g => median(vals(inGruppe(g), "lr")), v => pct(v, 2)],
    ["RWA-Dichte, Median", g => median(vals(inGruppe(g), "rwa_dichte")), v => pct(v, 1)],
    ["Fonds § 340g in % CET1, Median", g => median(vals(inGruppe(g), "fonds_cet1")), v => pct(v, 1)],
    ["mit KM1-Offenlegung", g => vals(inGruppe(g), "cet1_quote").length, f0.format],
  ];
  const tab = `<div class="scroll"><table><thead><tr><th>Kennzahl</th>${GRUPPEN.map(g => `<th><i class="sw" style="background:${g.farbe}"></i> ${g.kurz}</th>`).join("")}</tr></thead><tbody>${zeilen.map(([n, fn, fmt]) => `<tr><td>${n}</td>${GRUPPEN.map(g => { const v = fn(g.id); return `<td${v == null ? ' class="n"' : ""}>${v == null ? "n. v." : fmt(v)}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>`;

  // Passivstruktur aggregiert
  const ps = GRUPPEN.map(g => {
    const bs = inGruppe(g.id).map(passivStruktur).filter(Boolean);
    const t = Object.fromEntries(PASSIV.map(p => [p.k, sum(bs.map(x => x[p.k]))]));
    return { label: `${g.kurz} (n=${bs.length})`, farbe: g.farbe, teile: t, einheit: "mio" };
  });
  // CET1-Zusammensetzung aggregiert
  const cc = GRUPPEN.map(g => {
    const bs = inGruppe(g.id).filter(b => b.cc1_vor_abz != null);
    const t = Object.fromEntries(CC1.map(c => [c.k, sum(bs.map(b => Math.max(0, b[c.k] || 0)))]));
    return { label: `${g.kurz} (n=${bs.length})`, farbe: g.farbe, teile: t, einheit: "mio" };
  });
  // RWA-Zusammensetzung
  const ov = GRUPPEN.map(g => {
    const bs = inGruppe(g.id).map(ov1).filter(Boolean);
    const t = Object.fromEntries(OV1.map(c => [c.k, sum(bs.map(b => b[c.k]))]));
    return { label: `${g.kurz} (n=${bs.length})`, farbe: g.farbe, teile: t, einheit: "mio" };
  });

  return `<div class="grid">
    ${panel({ code: "GRP 1", titel: "Passivstruktur je Bankengruppe", sub: "Summe der HGB-Bilanzposten in % der Bilanzsumme", breite: "w7", body: legende(PASSIV) + stapel100(ps, PASSIV, { labelBreite: 110, hz: 34 }), fuss: "Nur Banken mit ausgelesener Formblatt-1-Bilanz; ohne Zusatzeinträge DZ BANK, DekaBank, DKB. Gewichtet nach Bilanzsumme: große Häuser dominieren." })}
    ${panel({ code: "GRP 2", titel: "Kennzahlen je Gruppe", sub: "Mediane der Einzelbanken", breite: "w5", body: tab, fuss: "KM1 = gemeldete Werte zum 31.12.2025 (Website-Bericht oder EBA-Hub). HGB = Einzelabschluss." })}
    ${panel({ code: "GRP 3", titel: "Woraus besteht das harte Kernkapital?", sub: "EU CC1, Bausteine vor Abzügen, Summe je Gruppe", breite: "w6", body: legende(CC1) + stapel100(cc, CC1, { labelBreite: 110, hz: 30 }), fuss: "Landesbanken melden auf Konzernebene (IFRS) und weisen den Fonds dort nicht als EU-3a aus." })}
    ${panel({ code: "GRP 4", titel: "Wofür wird Kapital gebunden?", sub: "EU OV1, Anteile am Gesamtrisikobetrag", breite: "w6", body: legende(OV1) + stapel100(ov, OV1, { labelBreite: 110, hz: 30 }), fuss: "Summe der RWA je Gruppe. Bei Privatbanken prägen Deutsche Bank und Commerzbank das Bild." })}
  </div>`;
}

/* ---------- Ansicht QUOT ---------- */
const QUOT_KZ = ["cet1_quote", "gk_quote", "gk_puffer_pp", "lr", "rwa_dichte", "ek_fonds_quote", "fonds_cet1"];
let quotKz = "cet1_quote", streuX = "rwa_dichte", streuY = "cet1_quote";

function strip(kz) {
  const def = KZ[kz], alle = BANKEN.filter(b => b[kz] != null);
  const xs = alle.map(b => b[kz]);
  let lo = Math.min(...xs), hi = Math.max(...xs);
  // Ausreißer begrenzen, damit die Masse lesbar bleibt
  const p02 = quant(xs, .02), p98 = quant(xs, .98), spann = p98 - p02;
  lo = Math.min(lo, p02); hi = Math.min(hi, p98 + spann * .35); lo = Math.max(lo, p02 - spann * .35);
  const W = 720, x0 = 70, x1 = W - 14, hz = 46, H = GRUPPEN.length * hz + 26;
  const sx = v => x0 + (x1 - x0) * (Math.min(Math.max(v, lo), hi) - lo) / (hi - lo || 1);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  const ticks = niceTicks(lo, hi, 6);
  ticks.forEach(t => { const x = sx(t); s += `<line class="gl" x1="${x}" x2="${x}" y1="0" y2="${H - 20}"/><text x="${x}" y="${H - 6}" text-anchor="middle">${kz === "gk_puffer_pp" ? f1.format(t) : nf(Math.abs(t * 100 - Math.round(t * 100)) < 1e-6 ? 0 : 1).format(t * 100) + " %"}</text>`; });
  GRUPPEN.forEach((g, i) => {
    const y = i * hz + 4, bs = alle.filter(b => b.gruppe === g.id), v = bs.filter(kern).map(b => b[kz]);
    s += `<text x="${x0 - 10}" y="${y + hz / 2}" text-anchor="end" dominant-baseline="middle" style="fill:var(--ink)">${g.kurz}</text>`;
    if (v.length) {
      const q1 = quant(v, .25), q3 = quant(v, .75), md = median(v);
      s += `<rect x="${sx(q1)}" y="${y + 6}" width="${Math.max(1, sx(q3) - sx(q1))}" height="${hz - 16}" fill="${g.farbe}" opacity=".14"/>`;
      s += `<line x1="${sx(md)}" x2="${sx(md)}" y1="${y + 3}" y2="${y + hz - 7}" stroke="var(--amber)" stroke-width="2"/>`;
    }
    bs.forEach((b, j) => {
      const jit = ((j * 37) % 17) / 17 - .5, cy = y + hz / 2 - 2 + jit * (hz - 22), clip = b[kz] > hi || b[kz] < lo;
      s += `<circle cx="${sx(b[kz])}" cy="${cy}" r="4" fill="${g.farbe}" stroke="var(--panel)" stroke-width="1.5" ${clip ? 'fill-opacity=".35"' : ""} data-tip="${esc(`<b>${esc(kurz(b.bank))}</b>\n${def.name}: ${def.f(b[kz])}\nBilanzsumme: ${mio(b.bs)} Mio. €${clip ? "\n(außerhalb der Skala)" : ""}`)}" data-bank="${esc(b.bank)}" style="cursor:pointer"/>`;
    });
    if (v.length) s += `<text x="${x1}" y="${y + 10}" text-anchor="end" style="fill:var(--ink-3)">Median ${def.f(median(v))} · n=${bs.length}</text>`;
  });
  return s + "</svg>";
}

function niceTicks(lo, hi, n) {
  const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0) || mag * 10;
  const out = []; for (let t = Math.ceil(lo / step) * step; t <= hi + 1e-12; t += step) out.push(+t.toFixed(10));
  return out;
}

function streu(kx, ky) {
  const pts = BANKEN.filter(b => b[kx] != null && b[ky] != null);
  const W = 720, H = 420, x0 = 56, x1 = W - 14, y0 = 10, y1 = H - 34;
  const cap = (k) => { const xs = pts.map(b => b[k]); const p = quant(xs, .97), q = quant(xs, .03); return [Math.max(0, q - (p - q) * .08), p + (p - q) * .12]; };
  const [lx, hx] = cap(kx), [ly, hy] = cap(ky);
  const sx = v => x0 + (x1 - x0) * (Math.min(Math.max(v, lx), hx) - lx) / (hx - lx);
  const sy = v => y1 - (y1 - y0) * (Math.min(Math.max(v, ly), hy) - ly) / (hy - ly);
  const maxBs = Math.max(...pts.map(b => b.bs || 0));
  const rad = b => 3 + 11 * Math.sqrt((b.bs || 0) / maxBs);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  const tick = k => t => k === "gk_puffer_pp" ? f1.format(t) : nf(Math.abs(t * 100 - Math.round(t * 100)) < 1e-6 ? 0 : 1).format(t * 100) + " %";
  const fx = tick(kx), fy = tick(ky);
  niceTicks(lx, hx, 7).forEach(t => { const x = sx(t); s += `<line class="gl" x1="${x}" x2="${x}" y1="${y0}" y2="${y1}"/><text x="${x}" y="${y1 + 14}" text-anchor="middle">${fx(t)}</text>`; });
  niceTicks(ly, hy, 6).forEach(t => { const y = sy(t); s += `<line class="gl" x1="${x0}" x2="${x1}" y1="${y}" y2="${y}"/><text x="${x0 - 6}" y="${y}" text-anchor="end" dominant-baseline="middle">${fy(t)}</text>`; });
  s += `<line class="ax" x1="${x0}" x2="${x1}" y1="${y1}" y2="${y1}"/><text x="${x1}" y="${H - 4}" text-anchor="end" style="fill:var(--amber)">${KZ[kx].name} →</text><text x="${x0}" y="${y0 - 0}" style="fill:var(--amber)" dy="-2">↑ ${KZ[ky].name}</text>`;
  // Mediane je Gruppe als Fadenkreuz
  [...pts].sort((a, b) => (b.bs || 0) - (a.bs || 0)).forEach(b => {
    const g = G[b.gruppe];
    s += `<circle cx="${sx(b[kx])}" cy="${sy(b[ky])}" r="${rad(b)}" fill="${g.farbe}" fill-opacity=".7" stroke="var(--panel)" stroke-width="1.5" data-bank="${esc(b.bank)}" style="cursor:pointer" data-tip="${esc(`<b>${esc(kurz(b.bank))}</b>\n${g.kurz} · BS ${mio(b.bs)} Mio. €\n${KZ[kx].name}: ${KZ[kx].f(b[kx])}\n${KZ[ky].name}: ${KZ[ky].f(b[ky])}\nKlick: in Vergleich übernehmen`)}"/>`;
  });
  // Beschriftung der fünf größten
  [...pts].sort((a, b) => (b.bs || 0) - (a.bs || 0)).slice(0, 5).forEach(b => {
    s += `<text x="${sx(b[kx]) + rad(b) + 3}" y="${sy(b[ky])}" dominant-baseline="middle" style="fill:var(--ink);pointer-events:none">${esc(kurz(b.bank).split(" ").slice(0, 2).join(" "))}</text>`;
  });
  return s + "</svg>";
}

function viewQuot() {
  const knopf = (k, aktiv, attr) => `<button type="button" ${attr}="${k}" aria-pressed="${k === aktiv}">${KZ[k].name}</button>`;
  const ctrl = `<div class="ctrl" style="margin-bottom:6px">${QUOT_KZ.map(k => knopf(k, quotKz, "data-strip")).join("")}</div>`;
  const ctrlX = `<div class="ctrl" style="margin-bottom:4px"><span style="color:var(--ink-3);padding-right:4px">X</span>${["rwa_dichte", "lr", "ek_fonds_quote", "fonds_cet1"].map(k => knopf(k, streuX, "data-sx")).join("")}</div>`;
  const ctrlY = `<div class="ctrl" style="margin-bottom:6px"><span style="color:var(--ink-3);padding-right:4px">Y</span>${["cet1_quote", "gk_quote", "gk_puffer_pp", "lr"].map(k => knopf(k, streuY, "data-sy")).join("")}</div>`;
  const leg = legende(GRUPPEN.map(g => ({ name: g.kurz + " · " + g.id, farbe: g.farbe })));
  return `<div class="grid">
    ${panel({ code: "QUOT 1", titel: "Verteilung je Gruppe", sub: "jeder Punkt eine Bank · Strich = Median · Band = mittlere 50 %", breite: "w6", body: ctrl + leg + strip(quotKz), fuss: "Median und Band ohne Zusatzeinträge. Blasse Punkte liegen außerhalb der Skala (Wert im Tooltip). Klick auf einen Punkt übernimmt die Bank in CMP." })}
    ${panel({ code: "QUOT 2", titel: "Risikodichte gegen Kapital", sub: "Kreisfläche ∝ Bilanzsumme", breite: "w6", body: ctrlX + ctrlY + leg + streu(streuX, streuY), fuss: "RWA-Dichte = RWA (KM1) / HGB-Bilanzsumme. Wo KM1 auf Gruppenebene gemeldet wird (viele Privat- und Landesbanken), ist das nur ein Richtwert." })}
  </div>`;
}

/* ---------- Ansicht CMP ---------- */
let auswahl = null;
const STANDARD_AUSWAHL = [/Hamburger Sparkasse/, /Berliner Volksbank/, /Helaba/, /^Commerzbank/];
const CMP_KZ = ["bs", "ek_quote", "ek_fonds_quote", "fonds_bs", "cet1_quote", "gk_quote", "gk_puffer_pp", "lr", "rwa_dichte", "fonds_cet1"];

function balkenVergleich(kz, banken) {
  const def = KZ[kz], W = 520, x0 = 170, x1 = W - 74, hz = 19;
  const zeilen = banken.map(b => ({ label: kurz(b.bank), v: b[kz], farbe: G[b.gruppe].farbe, med: median(vals(inGruppe(b.gruppe), kz)) }));
  const max = Math.max(...zeilen.map(z => Math.max(z.v || 0, z.med || 0))) || 1;
  const H = zeilen.length * hz + 4, sx = v => x0 + (x1 - x0) * Math.max(0, v) / max;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  zeilen.forEach((z, i) => {
    const y = i * hz + 2;
    s += `<text x="${x0 - 6}" y="${y + hz / 2}" text-anchor="end" dominant-baseline="middle">${esc(z.label.length > 24 ? z.label.slice(0, 23) + "…" : z.label)}</text>`;
    if (z.v == null) { s += `<text x="${x0}" y="${y + hz / 2}" dominant-baseline="middle" style="fill:var(--ink-3)">n. v.</text>`; return; }
    s += `<rect x="${x0}" y="${y + 3}" width="${Math.max(1, sx(z.v) - x0)}" height="${hz - 7}" fill="${z.farbe}" data-tip="${esc(`<b>${esc(z.label)}</b>\n${def.name}: ${def.f(z.v)}\nGruppenmedian: ${def.f(z.med)}`)}"/>`;
    if (z.med != null) s += `<line x1="${sx(z.med)}" x2="${sx(z.med)}" y1="${y + 1}" y2="${y + hz - 2}" stroke="var(--amber)" stroke-width="2"/>`;
    s += `<text x="${x1 + 6}" y="${y + hz / 2}" dominant-baseline="middle" style="fill:var(--ink)">${def.f(z.v)}</text>`;
  });
  return s + "</svg>";
}

function kapitalStack(banken) {
  const W = 720, x0 = 190, x1 = W - 12, hz = 26, H = banken.length * hz + 24;
  const max = Math.max(.3, ...banken.map(b => b.gk_quote || 0), ...banken.map(b => b.gk_anf || 0)) * 1.05;
  const sx = v => x0 + (x1 - x0) * v / max;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  niceTicks(0, max, 6).forEach(t => { const x = sx(t); s += `<line class="gl" x1="${x}" x2="${x}" y1="0" y2="${H - 20}"/><text x="${x}" y="${H - 5}" text-anchor="middle">${nf(Math.abs(t * 100 - Math.round(t * 100)) < 1e-6 ? 0 : 1).format(t * 100)} %</text>`; });
  const teile = [{ k: "cet1", name: "CET1", farbe: "var(--c3)" }, { k: "at1", name: "AT1", farbe: "var(--c2)" }, { k: "t2", name: "T2", farbe: "var(--s3)" }];
  banken.forEach((b, i) => {
    const y = i * hz + 3, g = G[b.gruppe];
    s += `<rect x="${x0 - 8}" y="${y + 4}" width="3" height="${hz - 11}" fill="${g.farbe}"/><text x="${x0 - 12}" y="${y + hz / 2}" text-anchor="end" dominant-baseline="middle" style="fill:var(--ink)">${esc(kurz(b.bank).slice(0, 26))}</text>`;
    if (b.cet1_quote == null) { s += `<text x="${x0}" y="${y + hz / 2}" dominant-baseline="middle" style="fill:var(--ink-3)">keine KM1-Offenlegung gefunden</text>`; return; }
    const q = { cet1: b.cet1_quote, at1: Math.max(0, (b.t1_quote || b.cet1_quote) - b.cet1_quote), t2: Math.max(0, (b.gk_quote || 0) - (b.t1_quote || b.cet1_quote)) };
    let x = x0;
    teile.forEach(t => { const w = sx(q[t.k]) - x0; if (w <= 0) return; s += `<rect x="${x + 1}" y="${y + 3}" width="${Math.max(0, w - 2)}" height="${hz - 9}" fill="${t.farbe}" data-tip="${esc(`<b>${esc(kurz(b.bank))}</b>\n${t.name}: ${pct(q[t.k], 2)} der RWA`)}"/>`; x += w; });
    if (b.gk_anf != null) { const xa = sx(b.gk_anf); s += `<line x1="${xa}" x2="${xa}" y1="${y}" y2="${y + hz - 3}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="3 2" data-tip="${esc(`<b>${esc(kurz(b.bank))}</b>\nAnforderung inkl. Puffer: ${pct(b.gk_anf, 2)}\nAbstand: ${pp(b.gk_puffer_pp)}`)}"/>`; }
    s += `<text x="${x + 6}" y="${y + hz / 2}" dominant-baseline="middle" style="fill:var(--ink)">${pct(b.gk_quote, 1)}</text>`;
  });
  return legende([...teile, { name: "Gesamtkapitalanforderung inkl. Puffer (gestrichelt)", farbe: "transparent; outline:1px dashed var(--ink)" }]) + s + "</svg>";
}

function zeitreiheTab(banken) {
  const jahre = ["2021", "2022", "2023", "2024", "2025"];
  return `<div class="scroll"><table><thead><tr><th>Bilanzsumme (Mio. €)</th>${jahre.map(j => `<th>${j}</th>`).join("")}<th>Δ 24→25</th></tr></thead><tbody>${banken.map(b => {
    const z = b.bs_zr, d = z["2024"] && z["2025"] ? z["2025"] / z["2024"] - 1 : null;
    return `<tr><td>${esc(kurz(b.bank).slice(0, 30))}</td>${jahre.map(j => z[j] != null ? `<td>${mio(z[j])}</td>` : `<td class="n">–</td>`).join("")}<td class="${d == null ? "n" : d >= 0 ? "pos" : "neg"}">${d == null ? "–" : (d >= 0 ? "+" : "") + pct(d, 1)}</td></tr>`;
  }).join("")}</tbody></table></div>`;
}

function viewCmp() {
  if (auswahl === null) auswahl = STANDARD_AUSWAHL.map(re => BANKEN.find(b => re.test(b.bank))).filter(Boolean).map(b => b.bank);
  const banken = auswahl.map(n => BANKEN.find(b => b.bank === n)).filter(Boolean);
  const picks = `<div class="picks">${banken.map(b => `<span class="chip"><i class="sw" style="background:${G[b.gruppe].farbe}"></i>${esc(kurz(b.bank))}<button type="button" data-weg="${esc(b.bank)}" aria-label="${esc(b.bank)} entfernen">×</button></span>`).join("")}
    <input id="cmpadd" list="banklist" placeholder="+ Bank hinzufügen (max. 6)" autocomplete="off" ${banken.length >= 6 ? "disabled" : ""}></div>`;

  // Kennzahlenmatrix mit Perzentil
  const matrix = `<div class="scroll"><table><thead><tr><th>Kennzahl</th>${banken.map(b => `<th title="${esc(b.bank)}"><i class="sw" style="background:${G[b.gruppe].farbe}"></i> ${esc(kurz(b.bank).slice(0, 18))}</th>`).join("")}</tr></thead><tbody>
    <tr><td>Gruppe · Rang</td>${banken.map(b => `<td>${G[b.gruppe].kurz} · ${b.rang != null ? f0.format(b.rang) : "–"}</td>`).join("")}</tr>
    ${CMP_KZ.map(k => { const alle = vals(BANKEN, k); return `<tr><td>${KZ[k].name}</td>${banken.map(b => { const v = b[k]; if (v == null) return `<td class="n">n. v.</td>`; const p = perzentil(v, alle); return `<td>${KZ[k].f(v)} <span class="pct" title="Perzentil unter allen Banken">P${f0.format(p * 100).padStart(2, "0")}</span></td>`; }).join("")}</tr>`; }).join("")}
    <tr><td>KM1-Ebene</td>${banken.map(b => `<td class="n" title="${esc(b.km1_ebene || "")}">${esc(b.km1_ebene ? (/Konzern|Gruppe|ggf\. Gruppe/.test(b.km1_ebene) ? "Gruppe/Konzern" : "Institut") : "–")}</td>`).join("")}</tr>
  </tbody></table></div>`;

  const ps = banken.map(b => ({ label: kurz(b.bank).slice(0, 22), farbe: G[b.gruppe].farbe, teile: passivStruktur(b) || {}, einheit: "mio" }));
  const ov = banken.map(b => ({ label: kurz(b.bank).slice(0, 22), farbe: G[b.gruppe].farbe, teile: ov1(b) || {}, einheit: "mio" }));
  const kleine = ["cet1_quote", "lr", "rwa_dichte", "ek_fonds_quote"].map(k => `<div><div style="color:var(--amber);margin:2px 0 2px">${KZ[k].name}</div>${balkenVergleich(k, banken)}</div>`).join("");

  return `<div class="grid">
    ${panel({ code: "CMP", titel: "Auswahl", sub: "Banken per Suche, Klick in QUOT oder RANK hinzufügen", body: picks })}
    ${panel({ code: "CMP 1", titel: "Kennzahlenmatrix", sub: "P = Perzentil unter allen 129 Banken (P99 = höchster Wert)", breite: "w7", body: matrix })}
    ${panel({ code: "CMP 2", titel: "Im Gruppenvergleich", sub: "Balken = Bank, Strich = Median ihrer Gruppe", breite: "w5", body: `<div style="display:grid;gap:8px">${kleine}</div>` })}
    ${panel({ code: "CMP 3", titel: "Kapitalquoten-Stack", sub: "CET1 + AT1 + T2 in % der RWA gegen Anforderung", breite: "w6", body: kapitalStack(banken), fuss: "Anforderung = KM1 Zeile EU 11a (SREP, kombinierte Puffer)." })}
    ${panel({ code: "CMP 4", titel: "Passivstruktur", sub: "HGB-Bilanz 31.12.2025", breite: "w6", body: legende(PASSIV) + stapel100(ps, PASSIV, { labelBreite: 160, hz: 26 }) })}
    ${panel({ code: "CMP 5", titel: "RWA-Zusammensetzung", sub: "EU OV1", breite: "w6", body: legende(OV1) + stapel100(ov, OV1, { labelBreite: 160, hz: 26 }) })}
    ${panel({ code: "CMP 6", titel: "Bilanzsumme im Zeitverlauf", sub: "soweit erhoben", breite: "w6", body: zeitreiheTab(banken) })}
  </div>`;
}

/* ---------- Ansicht RANK ---------- */
let rankSort = { k: "bs", ab: true }, rankGruppe = "alle";
const RANK_SP = ["bs", "ek_fonds_quote", "fonds_bs", "cet1_quote", "gk_quote", "gk_puffer_pp", "lr", "rwa_dichte"];
function viewRank() {
  const liste = BANKEN.filter(b => rankGruppe === "alle" || b.gruppe === rankGruppe)
    .sort((a, b) => { const x = a[rankSort.k], y = b[rankSort.k]; if (x == null) return 1; if (y == null) return -1; return rankSort.ab ? y - x : x - y; });
  const ctrl = `<div class="ctrl" style="margin-bottom:6px">${["alle", ...GRUPPEN.map(g => g.id)].map(g => `<button type="button" data-rg="${g}" aria-pressed="${g === rankGruppe}">${g === "alle" ? "Alle" : G[g].kurz}</button>`).join("")}</div>`;
  const kopf = `<tr><th>#</th><th style="text-align:left">Bank</th><th>Gr.</th>${RANK_SP.map(k => `<th class="sortable" data-sort="${k}">${KZ[k].name}${rankSort.k === k ? (rankSort.ab ? " ▼" : " ▲") : ""}</th>`).join("")}</tr>`;
  const rows = liste.map((b, i) => `<tr class="click" data-bank="${esc(b.bank)}" title="Klick: in Vergleich übernehmen"><td class="n">${i + 1}</td><td style="text-align:left">${esc(kurz(b.bank))}</td><td><i class="sw" style="background:${G[b.gruppe].farbe}"></i> ${G[b.gruppe].kurz}</td>${RANK_SP.map(k => b[k] == null ? `<td class="n">n. v.</td>` : `<td${k === "gk_puffer_pp" ? ` class="${b[k] >= 0 ? "pos" : "neg"}"` : ""}>${KZ[k].f(b[k])}</td>`).join("")}</tr>`).join("");
  return `<div class="grid">${panel({ code: "RANK", titel: "Bankenliste", sub: `${liste.length} Institute · Spaltenkopf sortiert · Zeile übernimmt in CMP`, body: ctrl + `<div class="tblwrap"><table><thead>${kopf}</thead><tbody>${rows}</tbody></table></div>` })}</div>`;
}

/* ---------- Ticker ---------- */
function tape() {
  document.getElementById("tape").innerHTML = GRUPPEN.map(g => {
    const b = inGruppe(g.id), m = k => median(vals(b, k));
    return `<div><div class="g"><i class="sw" style="background:${g.farbe}"></i>${g.kurz} <span style="text-transform:none;letter-spacing:0">${g.id} · ${b.length}</span></div>
      <div class="row"><span>CET1</span>${pct(m("cet1_quote"), 2)}<span>LR</span>${pct(m("lr"), 2)}</div>
      <div class="row"><span>EK+F/BS</span>${pct(m("ek_fonds_quote"), 2)}<span>RWA/BS</span>${pct(m("rwa_dichte"), 0)}</div></div>`;
  }).join("");
}

/* ---------- Routing & Ereignisse ---------- */
const VIEWS = { grp: viewGrp, quot: viewQuot, cmp: viewCmp, rank: viewRank };
let aktuell = "grp";
function render() {
  const h = location.hash.slice(1);
  aktuell = VIEWS[h] ? h : "grp";
  document.querySelectorAll(".key").forEach(k => k.dataset.v === aktuell ? k.setAttribute("aria-current", "page") : k.removeAttribute("aria-current"));
  document.getElementById("view").innerHTML = VIEWS[aktuell]();
  const add = document.getElementById("cmpadd");
  if (add) add.addEventListener("change", () => { bankDazu(add.value); });
}
function gehe(v) { if (location.hash === "#" + v) render(); else location.hash = v; }
function bankFinden(q) { q = q.trim().toLowerCase(); if (!q) return null; return BANKEN.find(b => b.bank.toLowerCase() === q) || BANKEN.find(b => b.bank.toLowerCase().includes(q)); }
function bankDazu(name) {
  const b = bankFinden(name); if (!b) return;
  if (auswahl === null) viewCmp();
  if (!auswahl.includes(b.bank)) { auswahl.push(b.bank); if (auswahl.length > 6) auswahl.shift(); }
  gehe("cmp");
}
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-strip]")) { quotKz = t.closest("[data-strip]").dataset.strip; render(); }
  else if (t.closest("[data-sx]")) { streuX = t.closest("[data-sx]").dataset.sx; render(); }
  else if (t.closest("[data-sy]")) { streuY = t.closest("[data-sy]").dataset.sy; render(); }
  else if (t.closest("[data-rg]")) { rankGruppe = t.closest("[data-rg]").dataset.rg; render(); }
  else if (t.closest("[data-sort]")) { const k = t.closest("[data-sort]").dataset.sort; rankSort = { k, ab: rankSort.k === k ? !rankSort.ab : true }; render(); }
  else if (t.closest("[data-weg]")) { const n = t.closest("[data-weg]").dataset.weg; auswahl = auswahl.filter(x => x !== n); render(); }
  else if (t.closest("[data-bank]")) { bankDazu(t.closest("[data-bank]").dataset.bank); }
});
document.getElementById("cmd").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const v = e.target.value.trim(), c = v.toLowerCase().replace(/\s*<?go>?$/, "");
  e.target.value = "";
  if (VIEWS[c]) gehe(c); else bankDazu(v);
});
document.addEventListener("keydown", e => {
  const m = { F1: "grp", F2: "quot", F3: "cmp", F4: "rank" }[e.key];
  if (m) { e.preventDefault(); gehe(m); }
});
addEventListener("hashchange", render);

/* ---------- Start ---------- */
async function start() {
  const el = document.getElementById("daten");
  try { DATA = JSON.parse(el.textContent); } catch { DATA = await (await fetch("../data/banken.json")).json(); }
  BANKEN = DATA.banken.filter(b => G[b.gruppe]).map(abgeleitet);
  document.getElementById("meta").textContent = `${BANKEN.length} Institute · Stichtag ${DATA.meta.stichtag.split("-").reverse().join(".")} · Beträge Mio. €`;
  document.getElementById("banklist").innerHTML = BANKEN.map(b => `<option value="${esc(b.bank)}">`).join("");
  tape();
  render();
}
start();
</script>
