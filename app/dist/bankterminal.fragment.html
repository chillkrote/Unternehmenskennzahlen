<style>
/* Layout: Terminal im Dunkeln, aber luftiger. Kopf mit Kommandozeile und Reitern, Kennzahlen-Kacheln, darunter ein 12er-Raster aus Panels. Zahlen in Mono, Text in Sans. Nur dunkel. */
:root {
  color-scheme: dark;
  --bg: #07090c;          /* Bildschirm */
  --panel: #0e1116;       /* Panel-Fläche */
  --panel-2: #131820;     /* Kopfzeilen, Hover */
  --line: #1f252e;        /* Rahmen */
  --line-2: #171c23;      /* Tabellenlinien */
  --grid: #1a1f27;        /* Diagramm-Gitter */
  --ink: #e8ecf1;         /* Zahlen */
  --ink-2: #a3acb8;       /* Beschriftung */
  --ink-3: #66707d;       /* Hilfstext */
  --amber: #ffa828;       /* Terminal-Akzent */
  --amber-dim: #a86a10;
  --amber-bg: rgba(255, 168, 40, .1);
  --key: #f5c400;         /* Funktionstasten, Ticker */
  --up: #3ecf6e;
  --down: #ff5248;
  /* Gruppen (validiert gegen --bg, CVD-sicher) */
  --spk: #e8484f;
  --geno: #2f86dd;
  --lb: #17a88a;
  --priv: #9a6fe0;
  /* Struktur-Rampen (keine Gruppenfarben) */
  --s1: #3a4350; --s2: #535e6d; --s3: #717d8d; --s4: #939eac;
  --c1: #7a4d08; --c2: #c27a0c; --c3: #ffb238;
  --r: 8px;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --cond: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font: 13px/1.5 var(--sans); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; display: grid; gap: 14px; }
a { color: var(--amber); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--key); outline-offset: 2px; border-radius: 4px; }
code { font-family: var(--mono); color: var(--key); }

/* Kopf */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(7, 9, 12, .92); backdrop-filter: blur(8px); display: grid; gap: 10px; padding-block: 12px 0; border-bottom: 1px solid var(--line); }
.cmd { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: inline-flex; align-items: baseline; gap: 8px; font: 600 15px/1 var(--cond); letter-spacing: .04em; color: var(--ink); }
.brand b { color: var(--bg); background: var(--amber); padding: 4px 7px; border-radius: 5px; font-size: 13px; letter-spacing: .08em; }
.cmdline { flex: 1 1 280px; min-width: 0; display: flex; align-items: center; gap: 8px; background: #000; border: 1px solid var(--line); border-radius: var(--r); padding: 6px 12px; font-family: var(--mono); transition: border-color .15s; }
.cmdline:focus-within { border-color: var(--amber-dim); }
.cmdline span { color: var(--amber); }
.cmdline input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--key); text-transform: uppercase; font-size: 12px; }
.cmdline input::placeholder { color: var(--ink-3); text-transform: none; }
.meta { color: var(--ink-3); white-space: nowrap; font-size: 12px; }
.keys { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.key { display: inline-flex; gap: 8px; align-items: center; padding: 8px 14px 10px; cursor: pointer; color: var(--ink-2); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; transition: color .15s, border-color .15s; }
.key b { color: var(--ink-3); border: 1px solid var(--line); padding: 0 5px; border-radius: 4px; font: 500 10.5px/1.6 var(--mono); }
.key[aria-current="page"] { color: var(--ink); border-bottom-color: var(--amber); }
.key[aria-current="page"] b { color: var(--bg); background: var(--key); border-color: var(--key); }
.key:hover { color: var(--ink); }

/* Kursleiste */
.quotes { display: flex; gap: 0; overflow-x: auto; white-space: nowrap; font: 12px/1 var(--mono); scrollbar-width: thin; padding-block: 2px; }
.quotes .ql { color: var(--ink-3); padding-right: 14px; align-self: center; font-family: var(--sans); text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
.quotes a { color: var(--ink); text-decoration: none; padding: 4px 14px; border-left: 1px solid var(--line); }
.quotes a:hover { background: var(--panel-2); }
.quotes a b { color: var(--key); font-weight: 500; margin-right: 4px; }

/* Kennzahlen-Kacheln: Gruppenmediane */
.tape { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.tape > div { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 10px; position: relative; overflow: hidden; }
.tape > div::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--gf); }
.tape .g { display: flex; align-items: baseline; gap: 8px; color: var(--ink-2); font-size: 12px; }
.tape .g b { color: var(--ink); font: 600 13px/1 var(--cond); letter-spacing: .06em; }
.tape .g span { margin-left: auto; color: var(--ink-3); font-family: var(--mono); font-size: 11px; }
.tape .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tape .stats div { display: grid; gap: 2px; }
.tape .stats span { color: var(--ink-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; }
.tape .stats strong { font: 500 15px/1.2 var(--mono); color: var(--ink); }
.sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }

/* Panels */
.grid { display: grid; gap: 14px; align-items: start; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.p { grid-column: span 12; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.col { grid-column: span 12; display: grid; gap: 14px; align-content: start; min-width: 0; }
.kzt td:first-child, .kzt th:first-child { position: sticky; left: 0; background: var(--panel); z-index: 1; }
.kzt th:first-child { z-index: 2; }
.kzt tr.click:hover td:first-child { background: var(--panel-2); }
@media (min-width: 1000px) { .w6 { grid-column: span 6; } .w7 { grid-column: span 7; } .w5 { grid-column: span 5; } .w4 { grid-column: span 4; } .w8 { grid-column: span 8; } }
.ph { display: flex; align-items: baseline; gap: 4px 12px; padding: 12px 16px 0; flex-wrap: wrap; }
.ph h2 { margin: 0; font: 600 14px/1.3 var(--sans); color: var(--ink); text-wrap: balance; }
.ph .code { font: 500 10.5px/1 var(--mono); color: var(--amber); background: var(--amber-bg); padding: 3px 6px; border-radius: 4px; margin-right: 6px; vertical-align: 2px; letter-spacing: .04em; }
.ph .sub { color: var(--ink-3); flex: 1 1 260px; font-size: 12px; }
.pb { padding: 12px 16px 14px; min-width: 0; }
.foot { padding: 10px 16px 12px; color: var(--ink-3); border-top: 1px solid var(--line-2); font-size: 11.5px; line-height: 1.55; max-width: 120ch; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-2); margin-bottom: 10px; font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.ctrl { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ctrl button, .chip { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; cursor: pointer; color: var(--ink-2); font-size: 12px; transition: color .15s, border-color .15s, background .15s; }
.ctrl button:hover { color: var(--ink); border-color: var(--s2); }
.ctrl button[aria-pressed="true"] { color: var(--amber); background: var(--amber-bg); border-color: var(--amber-dim); }
.ctrl > span { color: var(--ink-3); font: 500 11px var(--mono); }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: var(--sans); font-size: 11px; fill: var(--ink-2); }
svg .ax { stroke: var(--line); }
svg .gl { stroke: var(--grid); }
svg rect[data-tip] { rx: 2px; }
.scroll { overflow-x: auto; }

/* Tabellen */
table { border-collapse: collapse; width: 100%; white-space: nowrap; font: inherit; }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line-2); }
td { font-family: var(--mono); font-size: 12px; }
td:first-child { font-family: var(--sans); font-size: 13px; }
th { color: var(--ink-3); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; position: sticky; top: 0; background: var(--panel); border-bottom-color: var(--line); cursor: default; }
th.sortable { cursor: pointer; }
th.sortable:hover { color: var(--ink); }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
tbody tr:hover td { background: var(--panel-2); }
td.n { color: var(--ink-3); }
td.grp { font-family: var(--sans); color: var(--amber); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding-top: 14px; border-bottom-color: var(--line); }
.pos { color: var(--up); } .neg { color: var(--down); }
.pct { color: var(--ink-3); font-size: 10.5px; }
.tblwrap { max-height: 620px; overflow: auto; }
tr.click { cursor: pointer; }
tr.sel td { background: var(--amber-bg); }
.flat { color: var(--ink-2); }

/* Vergleich */
.picks { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); cursor: default; padding: 4px 6px 4px 12px; }
.chip button { background: none; border: 0; color: var(--ink-3); cursor: pointer; padding: 0 4px; border-radius: 999px; }
.chip button:hover { color: var(--down); }
.picks input { background: #000; border: 1px dashed var(--line); border-radius: 999px; padding: 4px 12px; min-width: 0; width: 280px; max-width: 100%; color: var(--key); }
.sub-h { color: var(--ink-2); font-size: 12px; margin: 4px 0 4px; }

#tip { position: fixed; z-index: 20; pointer-events: none; background: rgba(0, 0, 0, .94); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); padding: 7px 10px; color: var(--ink); max-width: 320px; white-space: pre-line; display: none; font: 12px/1.5 var(--mono); }
#tip b { color: var(--amber); font: 600 12px/1.5 var(--sans); }
@media (max-width: 600px) { .tape .stats strong { font-size: 13px; } .meta { display: none; } .key { padding-inline: 10px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.innerHTML = t.getAttribute("data-tip");
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - w - 8) + "px";
  tip.style.top = (e.clientY + 16 + h > innerHeight ? e.clientY - h - 10 : e.clientY + 16) + "px";
});

/* ---------- SVG-Bausteine ---------- */
function panel({ code, titel, sub = "", breite = "", body, fuss = "" }) {
  return `<section class="p ${breite}"><div class="ph"><h2><span class="code">${code}</span> ${esc(titel)}</h2><span class="sub">${sub}</span></div><div class="pb">${body}</div>${fuss ? `<div class="foot">${fuss}</div>` : ""}</section>`;
}
const legende = items => `<div class="legend">${items.map(i => `<span><i class="sw" style="background:${i.farbe}"></i>${esc(i.name)}</span>`).join("")}</div>`;

/* 100-%-Balken: zeilen = [{label, farbe?, teile:{k:v}, tip}] */
function stapel100(zeilen, teile, { labelBreite = 150, hz = 22, zeigeWerte = true } = {}) {
  const W = 720, x0 = labelBreite, x1 = W - 8, h = zeilen.length * hz + 22;
  let s = `<svg viewBox="0 0 ${W} ${h}" role="img">`;
  for (let p = 0; p <= 100; p += 25) { const x = x0 + (x1 - x0) * p / 100; s += `<line class="gl" x1="${x}" x2="${x}" y1="0" y2="${h - 18}"/><text x="${x}" y="${h - 5}" text-anchor="middle">${p} %</text>`; }
  zeilen.forEach((z, i) => {
    const y = i * hz + 3, tot = sum(teile.map(t => z.teile[t.k] || 0));
    s += `<text x="${x0 - 8}" y="${y + hz / 2 + 1}" text-anchor="end" dominant-baseline="middle" style="fill:var(--ink)">${esc(z.label)}</text>`;
    if (z.farbe) s += `<rect x="${x0 - 6}" y="${y + 3}" width="3" height="${hz - 9}" fill="${z.farbe}"/>`;
    if (!tot) { s += `<text x="${x0 + 4}" y="${y + hz / 2 + 1}" dominant-baseline="middle" style="fill:var(--ink-3)">n. v.</text>`; return; }
    let x = x0;
    teile.forEach(t => {
      const v = z.teile[t.k] || 0; if (v <= 0) return;
      const w = (x1 - x0) * v / tot, anteil = v / tot;
      const tt = `<b>${esc(z.label)}</b>\n${esc(t.name)}: ${pct(anteil)}${z.einheit === "mio" ? `\n${mio(v)} Mio. €` : ""}`;
      s += `<rect x="${x + 1}" y="${y + 2}" width="${Math.max(0, w - 2)}" height="${hz - 7}" fill="${t.farbe}" data-tip="${esc(tt)}"/>`;
      if (zeigeWerte && w > 34) s += `<text x="${x + w / 2}" y="${y + hz / 2}" text-anchor="middle" dominant-baseline="middle" style="fill:#050608;font-size:10px;pointer-events:none">${f0.format(anteil * 100)}</text>`;
      x += w;
    });
  });
  return s + "</svg>";
}

  const zeilen = [["Banken in Liste", g => inGruppe(g).length, f0.format],
    ["Σ Bilanzsumme (Mio. €)", g => sum(vals(inGruppe(g), "bs")), mio],
    ["EK-Quote, Median", g => median(vals(inGruppe(g), "ek_quote")), v => pct(v, 2)],
    ["Fonds § 340g in % BS, Median", g => median(vals(inGruppe(g), "fonds_bs")), v => pct(v, 2)],
    ["EK + Fonds in % BS, Median", g => median(vals(inGruppe(g), "ek_fonds_quote")), v => pct(v, 2)],
    ["Anteil Fonds an Δ (EK+Fonds) 24→25", g => { const b = inGruppe(g).filter(b => b.ek != null && b.vj_ek != null && b.fonds != null && b.vj_fonds != null); const df = sum(b.map(x => x.fonds - x.vj_fonds)), de = sum(b.map(x => x.ek - x.vj_ek)); return df + de ? df / (df + de) : null; }, v => pct(v, 0)],
    ["CET1-Quote, Median (KM1)", g => median(vals(inGruppe(g), "cet1_quote")), v => pct(v, 2)],
    ["Gesamtkapitalquote, Median", g => median(vals(inGruppe(g), "gk_quote")), v => pct(v, 2)],
    ["Leverage Ratio, Median", g => median(vals(inGruppe(g), "lr")), v => pct(v, 2)],
    ["RWA-Dichte, Median", g => median(vals(inGruppe(g), "rwa_dichte")), v => pct(v, 1)],
    ["Fonds § 340g in % CET1, Median", g => median(vals(inGruppe(g), "fonds_cet1")), v => pct(v, 1)],
    ["mit KM1-Offenlegung", g => vals(inGruppe(g), "cet1_quote").length, f0.format],

  const tab = `<div class="scroll"><table><thead><tr><th>Kennzahl</th>${GRUPPEN.map(g => `<th><i class="sw" style="background:${g.farbe}"></i> ${g.kurz}</th>`).join("")}</tr></thead><tbody>${zeilen.map(([n, fn, fmt]) => `<tr><td>${n}</td>${GRUPPEN.map(g => { const v = fn(g.id); return `<td${v == null ? ' class="n"' : ""}>${v == null ? "n. v." : fmt(v)}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>`;

  // Passivstruktur aggregiert
  const ps = GRUPPEN.map(g => {
    const bs = inGruppe(g.id).map(passivStruktur).filter(Boolean);
    const t = Object.fromEntries(PASSIV.map(p => [p.k, sum(bs.map(x => x[p.k]))]));
    return { label: `${g.kurz} (n=${bs.length})`, farbe: g.farbe, teile: t, einheit: "mio" };
  });
  // CET1-Zusammensetzung aggregiert
  const cc = GRUPPEN.map(g => {
    const bs = inGruppe(g.id).filter(b => b.cc1_vor_abz != null);
    const t = Object.fromEntries(CC1.map(c => [c.k, sum(bs.map(b => Math.max(0, b[c.k] || 0)))]));
    return { label: `${g.kurz} (n=${bs.length})`, farbe: g.farbe, teile: t, einheit: "mio" };
  });
  // RWA-Zusammensetzung
  const ov = GRUPPEN.map(g => {
    const bs = inGruppe(g.id).map(ov1).filter(Boolean);
    const t = Object.fromEntries(OV1.map(c => [c.k, sum(bs.map(b => b[c.k]))]));
    return { label: `${g.kurz} (n=${bs.length})`, farbe: g.farbe, teile: t, einheit: "mio" };
  });

  return `<div class="grid">
    ${panel({ code: "GRP 1", titel: "Passivstruktur je Bankengruppe", sub: "Summe der HGB-Bilanzposten in % der Bilanzsumme", breite: "w7", body: legende(PASSIV) + stapel100(ps, PASSIV, { labelBreite: 110, hz: 34 }), fuss: "Nur Banken mit ausgelesener Formblatt-1-Bilanz; ohne Zusatzeinträge DZ BANK, DekaBank, DKB. Gewichtet nach Bilanzsumme: große Häuser dominieren." })}
    ${panel({ code: "GRP 2", titel: "Kennzahlen je Gruppe", sub: "Mediane der Einzelbanken", breite: "w5", body: tab, fuss: "KM1 = gemeldete Werte zum 31.12.2025 (Website-Bericht oder EBA-Hub). HGB = Einzelabschluss." })}
    ${panel({ code: "GRP 3", titel: "Woraus besteht das harte Kernkapital?", sub: "EU CC1, Bausteine vor Abzügen, Summe je Gruppe", breite: "w6", body: legende(CC1) + stapel100(cc, CC1, { labelBreite: 110, hz: 30 }), fuss: "Landesbanken melden auf Konzernebene (IFRS) und weisen den Fonds dort nicht als EU-3a aus." })}
    ${panel({ code: "GRP 4", titel: "Wofür wird Kapital gebunden?", sub: "EU OV1, Anteile am Gesamtrisikobetrag", breite: "w6", body: legende(OV1) + stapel100(ov, OV1, { labelBreite: 110, hz: 30 }), fuss: "Summe der RWA je Gruppe. Bei Privatbanken prägen Deutsche Bank und Commerzbank das Bild." })}
  </div>`;
}

/* ---------- Ansicht QUOT ---------- */
const QUOT_KZ = ["cet1_quote", "gk_quote", "gk_puffer_pp", "lr", "rwa_dichte", "ek_fonds_quote", "fonds_cet1"];
let quotKz = "cet1_quote", streuX = "rwa_dichte", streuY = "cet1_quote";

function strip(kz) {
  const def = KZ[kz], alle = BANKEN.filter(b => b[kz] != null);
  const xs = alle.map(b => b[kz]);
  let lo = Math.min(...xs), hi = Math.max(...xs);
  // Ausreißer begrenzen, damit die Masse lesbar bleibt
  const p02 = quant(xs, .02), p98 = quant(xs, .98), spann = p98 - p02;
  lo = Math.min(lo, p02); hi = Math.min(hi, p98 + spann * .35); lo = Math.max(lo, p02 - spann * .35);
  const W = 720, x0 = 70, x1 = W - 14, hz = 46, H = GRUPPEN.length * hz + 26;
  const sx = v => x0 + (x1 - x0) * (Math.min(Math.max(v, lo), hi) - lo) / (hi - lo || 1);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  const ticks = niceTicks(lo, hi, 6);
  ticks.forEach(t => { const x = sx(t); s += `<line class="gl" x1="${x}" x2="${x}" y1="0" y2="${H - 20}"/><text x="${x}" y="${H - 6}" text-anchor="middle">${kz === "gk_puffer_pp" ? f1.format(t) : nf(Math.abs(t * 100 - Math.round(t * 100)) < 1e-6 ? 0 : 1).format(t * 100) + " %"}</text>`; });
  GRUPPEN.forEach((g, i) => {
    const y = i * hz + 4, bs = alle.filter(b => b.gruppe === g.id), v = bs.filter(kern).map(b => b[kz]);
    s += `<text x="${x0 - 10}" y="${y + hz / 2}" text-anchor="end" dominant-baseline="middle" style="fill:var(--ink)">${g.kurz}</text>`;
    if (v.length) {
      const q1 = quant(v, .25), q3 = quant(v, .75), md = median(v);
      s += `<rect x="${sx(q1)}" y="${y + 6}" width="${Math.max(1, sx(q3) - sx(q1))}" height="${hz - 16}" fill="${g.farbe}" opacity=".14"/>`;
      s += `<line x1="${sx(md)}" x2="${sx(md)}" y1="${y + 3}" y2="${y + hz - 7}" stroke="var(--amber)" stroke-width="2"/>`;
    }
    bs.forEach((b, j) => {
      const jit = ((j * 37) % 17) / 17 - .5, cy = y + hz / 2 - 2 + jit * (hz - 22), clip = b[kz] > hi || b[kz] < lo;
      s += `<circle cx="${sx(b[kz])}" cy="${cy}" r="4" fill="${g.farbe}" stroke="var(--panel)" stroke-width="1.5" ${clip ? 'fill-opacity=".35"' : ""} data-tip="${esc(`<b>${esc(kurz(b.bank))}</b>\n${def.name}: ${def.f(b[kz])}\nBilanzsumme: ${mio(b.bs)} Mio. €${clip ? "\n(außerhalb der Skala)" : ""}`)}" data-bank="${esc(b.bank)}" style="cursor:pointer"/>`;
    });
    if (v.length) s += `<text x="${x1}" y="${y + 10}" text-anchor="end" style="fill:var(--ink-3)">Median ${def.f(median(v))} · n=${bs.length}</text>`;
  });
  return s + "</svg>";
}

function niceTicks(lo, hi, n) {
  const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0) || mag * 10;
  const out = []; for (let t = Math.ceil(lo / step) * step; t <= hi + 1e-12; t += step) out.push(+t.toFixed(10));
  return out;
}

function streu(kx, ky) {
  const pts = BANKEN.filter(b => b[kx] != null && b[ky] != null);
  const W = 720, H = 420, x0 = 56, x1 = W - 14, y0 = 10, y1 = H - 34;
  const cap = (k) => { const xs = pts.map(b => b[k]); const p = quant(xs, .97), q = quant(xs, .03); return [Math.max(0, q - (p - q) * .08), p + (p - q) * .12]; };
  const [lx, hx] = cap(kx), [ly, hy] = cap(ky);
  const sx = v => x0 + (x1 - x0) * (Math.min(Math.max(v, lx), hx) - lx) / (hx - lx);
  const sy = v => y1 - (y1 - y0) * (Math.min(Math.max(v, ly), hy) - ly) / (hy - ly);
  const maxBs = Math.max(...pts.map(b => b.bs || 0));
  const rad = b => 3 + 11 * Math.sqrt((b.bs || 0) / maxBs);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  const tick = k => t => k === "gk_puffer_pp" ? f1.format(t) : nf(Math.abs(t * 100 - Math.round(t * 100)) < 1e-6 ? 0 : 1).format(t * 100) + " %";
  const fx = tick(kx), fy = tick(ky);
  niceTicks(lx, hx, 7).forEach(t => { const x = sx(t); s += `<line class="gl" x1="${x}" x2="${x}" y1="${y0}" y2="${y1}"/><text x="${x}" y="${y1 + 14}" text-anchor="middle">${fx(t)}</text>`; });
  niceTicks(ly, hy, 6).forEach(t => { const y = sy(t); s += `<line class="gl" x1="${x0}" x2="${x1}" y1="${y}" y2="${y}"/><text x="${x0 - 6}" y="${y}" text-anchor="end" dominant-baseline="middle">${fy(t)}</text>`; });
  s += `<line class="ax" x1="${x0}" x2="${x1}" y1="${y1}" y2="${y1}"/><text x="${x1}" y="${H - 4}" text-anchor="end" style="fill:var(--amber)">${KZ[kx].name} →</text><text x="${x0}" y="${y0 - 0}" style="fill:var(--amber)" dy="-2">↑ ${KZ[ky].name}</text>`;
  // Mediane je Gruppe als Fadenkreuz
  [...pts].sort((a, b) => (b.bs || 0) - (a.bs || 0)).forEach(b => {
    const g = G[b.gruppe];
    s += `<circle cx="${sx(b[kx])}" cy="${sy(b[ky])}" r="${rad(b)}" fill="${g.farbe}" fill-opacity=".7" stroke="var(--panel)" stroke-width="1.5" data-bank="${esc(b.bank)}" style="cursor:pointer" data-tip="${esc(`<b>${esc(kurz(b.bank))}</b>\n${g.kurz} · BS ${mio(b.bs)} Mio. €\n${KZ[kx].name}: ${KZ[kx].f(b[kx])}\n${KZ[ky].name}: ${KZ[ky].f(b[ky])}\nKlick: in Vergleich übernehmen`)}"/>`;
  });
  // Beschriftung der fünf größten
  [...pts].sort((a, b) => (b.bs || 0) - (a.bs || 0)).slice(0, 5).forEach(b => {
    s += `<text x="${sx(b[kx]) + rad(b) + 3}" y="${sy(b[ky])}" dominant-baseline="middle" style="fill:var(--ink);pointer-events:none">${esc(kurz(b.bank).split(" ").slice(0, 2).join(" "))}</text>`;
  });
  return s + "</svg>";
}

function viewQuot() {
  const knopf = (k, aktiv, attr) => `<button type="button" ${attr}="${k}" aria-pressed="${k === aktiv}">${KZ[k].name}</button>`;
  const ctrl = `<div class="ctrl" style="margin-bottom:12px">${QUOT_KZ.map(k => knopf(k, quotKz, "data-strip")).join("")}</div>`;
  const ctrlX = `<div class="ctrl" style="margin-bottom:8px"><span style="color:var(--ink-3);padding-right:4px">X</span>${["rwa_dichte", "lr", "ek_fonds_quote", "fonds_cet1"].map(k => knopf(k, streuX, "data-sx")).join("")}</div>`;
  const ctrlY = `<div class="ctrl" style="margin-bottom:12px"><span style="color:var(--ink-3);padding-right:4px">Y</span>${["cet1_quote", "gk_quote", "gk_puffer_pp", "lr"].map(k => knopf(k, streuY, "data-sy")).join("")}</div>`;
  const leg = legende(GRUPPEN.map(g => ({ name: g.kurz + " · " + g.id, farbe: g.farbe })));
  return `<div class="grid">
    ${panel({ code: "QUOT 1", titel: "Verteilung je Gruppe", sub: "jeder Punkt eine Bank · Strich = Median · Band = mittlere 50 %", breite: "w6", body: ctrl + leg + strip(quotKz), fuss: "Median und Band ohne Zusatzeinträge. Blasse Punkte liegen außerhalb der Skala (Wert im Tooltip). Klick auf einen Punkt übernimmt die Bank in CMP." })}
    ${panel({ code: "QUOT 2", titel: "Risikodichte gegen Kapital", sub: "Kreisfläche ∝ Bilanzsumme", breite: "w6", body: ctrlX + ctrlY + leg + streu(streuX, streuY), fuss: "RWA-Dichte = RWA (KM1) / HGB-Bilanzsumme. Wo KM1 auf Gruppenebene gemeldet wird (viele Privat- und Landesbanken), ist das nur ein Richtwert." })}
  </div>`;
}

/* ---------- Ansicht CMP ---------- */
let auswahl = null;
const STANDARD_AUSWAHL = [/Hamburger Sparkasse/, /Berliner Volksbank/, /Helaba/, /^Commerzbank/];
const CMP_KZ = ["bs", "ek_quote", "ek_fonds_quote", "fonds_bs", "cet1_quote", "gk_quote", "gk_puffer_pp", "lr", "rwa_dichte", "fonds_cet1", "mkap", "mkap_ek"];

function balkenVergleich(kz, banken) {
  const def = KZ[kz], W = 520, x0 = 170, x1 = W - 74, hz = 19;
  const zeilen = banken.map(b => ({ label: kurz(b.bank), v: b[kz], farbe: G[b.gruppe].farbe, med: median(vals(inGruppe(b.gruppe), kz)) }));
  const max = Math.max(...zeilen.map(z => Math.max(z.v || 0, z.med || 0))) || 1;
  const H = zeilen.length * hz + 4, sx = v => x0 + (x1 - x0) * Math.max(0, v) / max;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  zeilen.forEach((z, i) => {
    const y = i * hz + 2;
    s += `<text x="${x0 - 6}" y="${y + hz / 2}" text-anchor="end" dominant-baseline="middle">${esc(z.label.length > 24 ? z.label.slice(0, 23) + "…" : z.label)}</text>`;
    if (z.v == null) { s += `<text x="${x0}" y="${y + hz / 2}" dominant-baseline="middle" style="fill:var(--ink-3)">n. v.</text>`; return; }
    s += `<rect x="${x0}" y="${y + 3}" width="${Math.max(1, sx(z.v) - x0)}" height="${hz - 7}" fill="${z.farbe}" data-tip="${esc(`<b>${esc(z.label)}</b>\n${def.name}: ${def.f(z.v)}\nGruppenmedian: ${def.f(z.med)}`)}"/>`;
    if (z.med != null) s += `<line x1="${sx(z.med)}" x2="${sx(z.med)}" y1="${y + 1}" y2="${y + hz - 2}" stroke="var(--amber)" stroke-width="2"/>`;
    s += `<text x="${x1 + 6}" y="${y + hz / 2}" dominant-baseline="middle" style="fill:var(--ink)">${def.f(z.v)}</text>`;
  });
  return s + "</svg>";
}

function kapitalStack(banken) {
  const W = 720, x0 = 190, x1 = W - 12, hz = 26, H = banken.length * hz + 24;
  const max = Math.max(.3, ...banken.map(b => b.gk_quote || 0), ...banken.map(b => b.gk_anf || 0)) * 1.05;
  const sx = v => x0 + (x1 - x0) * v / max;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  niceTicks(0, max, 6).forEach(t => { const x = sx(t); s += `<line class="gl" x1="${x}" x2="${x}" y1="0" y2="${H - 20}"/><text x="${x}" y="${H - 5}" text-anchor="middle">${nf(Math.abs(t * 100 - Math.round(t * 100)) < 1e-6 ? 0 : 1).format(t * 100)} %</text>`; });
  const teile = [{ k: "cet1", name: "CET1", farbe: "var(--c3)" }, { k: "at1", name: "AT1", farbe: "var(--c2)" }, { k: "t2", name: "T2", farbe: "var(--s3)" }];
  banken.forEach((b, i) => {
    const y = i * hz + 3, g = G[b.gruppe];
    s += `<rect x="${x0 - 8}" y="${y + 4}" width="3" height="${hz - 11}" fill="${g.farbe}"/><text x="${x0 - 12}" y="${y + hz / 2}" text-anchor="end" dominant-baseline="middle" style="fill:var(--ink)">${esc(kurz(b.bank).slice(0, 26))}</text>`;
    if (b.cet1_quote == null) { s += `<text x="${x0}" y="${y + hz / 2}" dominant-baseline="middle" style="fill:var(--ink-3)">keine KM1-Offenlegung gefunden</text>`; return; }
    const q = { cet1: b.cet1_quote, at1: Math.max(0, (b.t1_quote || b.cet1_quote) - b.cet1_quote), t2: Math.max(0, (b.gk_quote || 0) - (b.t1_quote || b.cet1_quote)) };
    let x = x0;
    teile.forEach(t => { const w = sx(q[t.k]) - x0; if (w <= 0) return; s += `<rect x="${x + 1}" y="${y + 3}" width="${Math.max(0, w - 2)}" height="${hz - 9}" fill="${t.farbe}" data-tip="${esc(`<b>${esc(kurz(b.bank))}</b>\n${t.name}: ${pct(q[t.k], 2)} der RWA`)}"/>`; x += w; });
    if (b.gk_anf != null) { const xa = sx(b.gk_anf); s += `<line x1="${xa}" x2="${xa}" y1="${y}" y2="${y + hz - 3}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="3 2" data-tip="${esc(`<b>${esc(kurz(b.bank))}</b>\nAnforderung inkl. Puffer: ${pct(b.gk_anf, 2)}\nAbstand: ${pp(b.gk_puffer_pp)}`)}"/>`; }
    s += `<text x="${x + 6}" y="${y + hz / 2}" dominant-baseline="middle" style="fill:var(--ink)">${pct(b.gk_quote, 1)}</text>`;
  });
  return legende([...teile, { name: "Gesamtkapitalanforderung inkl. Puffer (gestrichelt)", farbe: "transparent; outline:1px dashed var(--ink)" }]) + s + "</svg>";
}

function zeitreiheTab(banken) {
  const jahre = ["2021", "2022", "2023", "2024", "2025"];
  return `<div class="scroll"><table><thead><tr><th>Bilanzsumme (Mio. €)</th>${jahre.map(j => `<th>${j}</th>`).join("")}<th>Δ 24→25</th></tr></thead><tbody>${banken.map(b => {
    const z = b.bs_zr, d = z["2024"] && z["2025"] ? z["2025"] / z["2024"] - 1 : null;
    return `<tr><td>${esc(kurz(b.bank).slice(0, 30))}</td>${jahre.map(j => z[j] != null ? `<td>${mio(z[j])}</td>` : `<td class="n">–</td>`).join("")}<td class="${d == null ? "n" : d >= 0 ? "pos" : "neg"}">${d == null ? "–" : (d >= 0 ? "+" : "") + pct(d, 1)}</td></tr>`;
  }).join("")}</tbody></table></div>`;
}

function viewCmp() {
  if (auswahl === null) auswahl = STANDARD_AUSWAHL.map(re => BANKEN.find(b => re.test(b.bank))).filter(Boolean).map(b => b.bank);
  const banken = auswahl.map(n => BANKEN.find(b => b.bank === n)).filter(Boolean);
  const picks = `<div class="picks">${banken.map(b => `<span class="chip"><i class="sw" style="background:${G[b.gruppe].farbe}"></i>${esc(kurz(b.bank))}<button type="button" data-weg="${esc(b.bank)}" aria-label="${esc(b.bank)} entfernen">×</button></span>`).join("")}
    <input id="cmpadd" list="banklist" placeholder="+ Bank hinzufügen (max. 6)" autocomplete="off" ${banken.length >= 6 ? "disabled" : ""}></div>`;

  // Kennzahlenmatrix mit Perzentil
  const matrix = `<div class="scroll"><table><thead><tr><th>Kennzahl</th>${banken.map(b => `<th title="${esc(b.bank)}"><i class="sw" style="background:${G[b.gruppe].farbe}"></i> ${esc(kurz(b.bank).slice(0, 18))}</th>`).join("")}</tr></thead><tbody>
    <tr><td>Gruppe · Rang</td>${banken.map(b => `<td>${G[b.gruppe].kurz} · ${b.rang != null ? f0.format(b.rang) : "–"}</td>`).join("")}</tr>
    ${CMP_KZ.filter(k => !KZ[k].markt || banken.some(b => b[k] != null)).map(k => { const alle = vals(BANKEN, k); return `<tr><td>${KZ[k].name}</td>${banken.map(b => { const v = b[k]; if (v == null) return `<td class="n">n. v.</td>`; const p = perzentil(v, alle); return `<td>${KZ[k].f(v)} <span class="pct" title="Perzentil unter allen Banken">P${f0.format(p * 100).padStart(2, "0")}</span></td>`; }).join("")}</tr>`; }).join("")}
    ${banken.some(b => b.markt) ? `<tr><td>Aktie (YTD)</td>${banken.map(b => b.markt ? `<td title="${esc(b.markt.mutter ? "Muttergesellschaft: " + b.markt.mutter : "Bank selbst notiert")}">${b.markt.ticker}${b.markt.ebene === "Mutter" ? "*" : ""} <span class="${klasse(b.markt.r_ytd)}">${chg(b.markt.r_ytd)}</span></td>` : `<td class="n">nicht notiert</td>`).join("")}</tr>` : ""}
    <tr><td>KM1-Ebene</td>${banken.map(b => `<td class="n" title="${esc(b.km1_ebene || "")}">${esc(b.km1_ebene ? (/Konzern|Gruppe|ggf\. Gruppe/.test(b.km1_ebene) ? "Gruppe/Konzern" : "Institut") : "–")}</td>`).join("")}</tr>
  </tbody></table></div>`;

  const ps = banken.map(b => ({ label: kurz(b.bank).slice(0, 22), farbe: G[b.gruppe].farbe, teile: passivStruktur(b) || {}, einheit: "mio" }));
  const ov = banken.map(b => ({ label: kurz(b.bank).slice(0, 22), farbe: G[b.gruppe].farbe, teile: ov1(b) || {}, einheit: "mio" }));
  const kleine = ["cet1_quote", "lr", "rwa_dichte", "ek_fonds_quote"].map(k => `<div><div class="sub-h">${KZ[k].name}</div>${balkenVergleich(k, banken)}</div>`).join("");

  return `<div class="grid">
    ${panel({ code: "CMP", titel: "Auswahl", sub: "Banken per Suche, Klick in QUOT oder RANK hinzufügen", body: picks })}
    ${panel({ code: "CMP 1", titel: "Kennzahlenmatrix", sub: `P = Perzentil unter allen ${BANKEN.length} Banken (P99 = höchster Wert)`, breite: "w7", body: matrix })}
    ${panel({ code: "CMP 2", titel: "Im Gruppenvergleich", sub: "Balken = Bank, Strich = Median ihrer Gruppe", breite: "w5", body: `<div style="display:grid;gap:8px">${kleine}</div>` })}
    ${panel({ code: "CMP 3", titel: "Kapitalquoten-Stack", sub: "CET1 + AT1 + T2 in % der RWA gegen Anforderung", breite: "w6", body: kapitalStack(banken), fuss: "Anforderung = KM1 Zeile EU 11a (SREP, kombinierte Puffer)." })}
    ${panel({ code: "CMP 4", titel: "Passivstruktur", sub: "HGB-Bilanz 31.12.2025", breite: "w6", body: legende(PASSIV) + stapel100(ps, PASSIV, { labelBreite: 160, hz: 26 }) })}
    ${panel({ code: "CMP 5", titel: "RWA-Zusammensetzung", sub: "EU OV1", breite: "w6", body: legende(OV1) + stapel100(ov, OV1, { labelBreite: 160, hz: 26 }) })}
    ${panel({ code: "CMP 6", titel: "Bilanzsumme im Zeitverlauf", sub: "soweit erhoben", breite: "w6", body: zeitreiheTab(banken) })}
  </div>`;
}

let rankSort = { k: "bs", ab: true }, rankGruppe = "alle";
const RANK_SP = ["bs", "ek_fonds_quote", "fonds_bs", "cet1_quote", "gk_quote", "gk_puffer_pp", "lr", "rwa_dichte"];

}

/* ---------- Ansicht MKT (Börsendaten, getrennt von den GJ-Daten) ---------- */
let MARKT = null, mktFenster = "1j", mktMuetter = false, mktMarkiert = "CBK.DE";
const chg = v => v == null ? "–" : (v > 0 ? "+" : "") + f1.format(v * 100) + " %";
const klasse = v => v == null ? "n" : v > 0.0005 ? "pos" : v < -0.0005 ? "neg" : "flat";
const kursF = (v, w) => v == null ? "n. v." : nf(v >= 1000 ? 0 : 2).format(v) + (w && w !== "EUR" ? " " + w : "");
const FENSTER = { "1m": ["1M", 31], "6m": ["6M", 183], "ytd": ["YTD", null], "1j": ["1J", 366] };
function fensterStart(letzter) {
  if (mktFenster === "ytd") return letzter.slice(0, 4) + "-01-01";
  const d = new Date(letzter); d.setDate(d.getDate() - FENSTER[mktFenster][1]); return d.toISOString().slice(0, 10);
}
function eindeutig() { const s = new Set(); return MARKT.werte.filter(w => !s.has(w.ticker) && s.add(w.ticker)); }

function spark(w) {
  const k = w.kurse.map(x => x[1]), W = 110, H = 22, lo = Math.min(...k), hi = Math.max(...k);
  const pts = k.map((v, i) => `${(i / (k.length - 1) * W).toFixed(1)},${(H - 2 - (v - lo) / (hi - lo || 1) * (H - 4)).toFixed(1)}`).join(" ");
  const farbe = k[k.length - 1] >= k[0] ? "var(--up)" : "var(--down)";
  return `<svg viewBox="0 0 ${W} ${H}" style="width:110px" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${farbe}" stroke-width="1.2"/><circle cx="${W}" cy="${pts.split(" ").pop().split(",")[1]}" r="2" fill="${farbe}"/></svg>`;
}
function spanne(w) {
  const x = (w.kurs - w.tief_52w) / ((w.hoch_52w - w.tief_52w) || 1) * 76 + 2;
  return `<svg viewBox="0 0 80 10" style="width:80px" data-tip="${esc(`52 Wochen: ${kursF(w.tief_52w, w.waehrung)} – ${kursF(w.hoch_52w, w.waehrung)}`)}"><line x1="2" x2="78" y1="5" y2="5" stroke="var(--s2)" stroke-width="2"/><circle cx="${x}" cy="5" r="3" fill="var(--amber)"/></svg>`;
}

function indexChart(liste) {
  const W = 1100, H = 420, x0 = 44, x1 = W - 92, y0 = 12, y1 = H - 26;
  const letzter = liste.reduce((m, w) => w.datum > m ? w.datum : m, "");
  const start = fensterStart(letzter);
  const reihen = liste.map(w => {
    const k = w.kurse.filter(([d]) => d >= start);
    const basis = (w.kurse.filter(([d]) => d < start).pop() || k[0])[1];
    return { w, pts: k.map(([d, c]) => [d, c / basis * 100]) };
  }).filter(r => r.pts.length > 1);
  if (!reihen.length) return `<p class="n">Keine Kurse im Zeitraum.</p>`;
  const alle = reihen.flatMap(r => r.pts.map(p => p[1]));
  let lo = Math.min(100, ...alle), hi = Math.max(100, ...alle); const pad = (hi - lo) * .06; lo -= pad; hi += pad;
  const t0 = new Date(start).getTime(), t1 = new Date(letzter).getTime();
  const sx = d => x0 + (x1 - x0) * (new Date(d).getTime() - t0) / (t1 - t0 || 1), sy = v => y1 - (y1 - y0) * (v - lo) / (hi - lo);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  niceTicks(lo, hi, 6).forEach(t => s += `<line class="gl" x1="${x0}" x2="${x1}" y1="${sy(t)}" y2="${sy(t)}"/><text x="${x0 - 6}" y="${sy(t)}" text-anchor="end" dominant-baseline="middle">${f0.format(t)}</text>`);
  s += `<line x1="${x0}" x2="${x1}" y1="${sy(100)}" y2="${sy(100)}" stroke="var(--ink-3)" stroke-dasharray="2 3"/>`;
  // Monatsmarken
  const d = new Date(start); d.setDate(1); d.setMonth(d.getMonth() + 1);
  const monate = []; for (; d.getTime() <= t1; d.setMonth(d.getMonth() + 1)) monate.push(d.toISOString().slice(0, 10));
  const schritt = Math.ceil(monate.length / 8);
  monate.forEach((m, i) => { if (i % schritt) return; const x = sx(m); s += `<line class="gl" x1="${x}" x2="${x}" y1="${y0}" y2="${y1}"/><text x="${x}" y="${y1 + 14}" text-anchor="middle">${m.slice(5, 7)}/${m.slice(2, 4)}</text>`; });
  s += `<line class="ax" x1="${x0}" x2="${x1}" y1="${y1}" y2="${y1}"/>`;
  // Linien: grau, markierte Aktie in Amber obenauf
  const sortiert = [...reihen].sort((a, b) => (a.w.ticker === mktMarkiert) - (b.w.ticker === mktMarkiert));
  sortiert.forEach(r => {
    const an = r.w.ticker === mktMarkiert, d = r.pts.map(([t, v], i) => `${i ? "L" : "M"}${sx(t).toFixed(1)},${sy(v).toFixed(1)}`).join("");
    const ende = r.pts[r.pts.length - 1][1];
    const tt = esc(`<b>${esc(kurz(r.w.bank))}</b>${r.w.mutter ? "\nKurs der Mutter: " + esc(r.w.mutter) : ""}\n${r.w.ticker} · Index ${f1.format(ende)} (${chg(ende / 100 - 1)} seit ${start.split("-").reverse().join(".")})`);
    s += `<path d="${d}" fill="none" stroke="${an ? "var(--amber)" : "var(--s3)"}" stroke-width="${an ? 2.2 : 1.2}" stroke-linejoin="round"/>`;
    s += `<path d="${d}" fill="none" stroke="transparent" stroke-width="9" data-tip="${tt}" data-mkt="${r.w.ticker}" style="cursor:pointer"/>`;
  });
  // Endbeschriftung mit einfacher Kollisionsvermeidung
  const labels = reihen.map(r => ({ r, y: sy(r.pts[r.pts.length - 1][1]) })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 11) labels[i].y = labels[i - 1].y + 11;
  labels.forEach(({ r, y }) => { const an = r.w.ticker === mktMarkiert, e = r.pts[r.pts.length - 1][1];
    s += `<text x="${x1 + 6}" y="${y}" dominant-baseline="middle" style="fill:${an ? "var(--amber)" : "var(--ink-2)"}">${r.w.ticker.replace(/\.\w+$/, "")} ${f0.format(e)}</text>`; });
  return s + "</svg>";
}

function viewMkt() {
  if (!MARKT) return `<div class="grid">${panel({ code: "MKT", titel: "Börsendaten", body: `<p>Keine Börsendaten geladen. <code>python3 app/marktdaten.py</code> und danach <code>python3 app/build.py</code> ausführen.</p>` })}</div>`;
  const tick = eindeutig(), sichtbar = tick.filter(w => mktMuetter || w.ebene === "Institut");
  const zeilen = MARKT.werte.map(w => { const b = BANKEN.find(x => x.bank === w.bank) || {}; return `<tr class="click${w.ticker === mktMarkiert ? " sel" : ""}" data-mkt="${w.ticker}">
    <td>${esc(kurz(w.bank).slice(0, 30))}</td><td class="n" style="text-align:left">${w.ebene === "Institut" ? "Bank selbst" : "Mutter: " + esc(w.mutter || "")}</td><td style="color:var(--key);text-align:left">${w.ticker}</td>
    <td>${kursF(w.kurs, w.waehrung)}</td><td class="n">${w.datum.split("-").reverse().join(".")}</td>
    ${["r_1t", "r_1m", "r_ytd", "r_1j"].map(k => `<td class="${klasse(w[k])}">${chg(w[k])}</td>`).join("")}
    <td>${spanne(w)}</td><td>${w.marktkap ? f0.format(w.marktkap / 1e6) + (w.waehrung !== "EUR" ? " " + w.waehrung : "") : "n. v."}</td>
    <td${b.mkap_ek == null ? ' class="n"' : ""}>${b.mkap_ek == null ? "–" : f2.format(b.mkap_ek) + "x"}</td><td>${spark(w)}</td></tr>`; }).join("");
  const tab = `<div class="scroll"><table><thead><tr><th>Bank im Datensatz</th><th style="text-align:left">Notierung</th><th style="text-align:left">Ticker</th><th>Schluss</th><th>Stand</th><th>1T</th><th>1M</th><th>YTD</th><th>1J</th><th>52W-Spanne</th><th>Börsenwert (Mio.)</th><th>BW / HGB-EK</th><th>12M</th></tr></thead><tbody>${zeilen}</tbody></table></div>`;
  const ctrl = `<div class="ctrl" style="margin-bottom:12px">${Object.entries(FENSTER).map(([k, [n]]) => `<button type="button" data-fenster="${k}" aria-pressed="${k === mktFenster}">${n}</button>`).join("")}
    <button type="button" data-muetter="1" aria-pressed="${mktMuetter}" style="margin-left:8px">inkl. Muttergesellschaften</button></div>`;
  const abruf = new Date(MARKT.abruf);
  return `<div class="grid">
    ${panel({ code: "MKT 1", titel: "Notierte Banken", sub: `${MARKT.werte.length} Banken des Datensatzes mit Börsenkurs · Zeile markiert die Aktie im Chart`, body: tab,
      fuss: `Quelle: ${esc(MARKT.quelle)}, Abruf ${abruf.toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" })}. Börsenwert = Kurs × Aktienanzahl laut Yahoo. BW / HGB-EK setzt den Börsenwert des Konzerns ins Verhältnis zum Eigenkapital des HGB-Einzelabschlusses (nur wo die Bank selbst notiert ist), also nur ein Richtwert für das Kurs-Buchwert-Verhältnis.` })}
    ${panel({ code: "MKT 2", titel: "Kursentwicklung indexiert", sub: `Schlusskurs, Beginn des Zeitraums = 100 · ${sichtbar.length} Aktien`, body: ctrl + indexChart(sichtbar),
      fuss: "Kurse in Handelswährung, nicht dividendenbereinigt. Klick auf eine Linie oder Tabellenzeile hebt die Aktie hervor." })}
    ${kennzahlenPanels(sichtbar)}
  </div>`;
}

/* ---------- MKT 3–5: Bilanz-, GuV- und Bewertungskennzahlen (Konzern laut Yahoo) ---------- */
const xf = v => v == null ? "n. v." : f1.format(v) + "x";
const MKZ = [
  ["Bewertung", [
    ["kgv", "KGV (Kurs / EPS)", xf, null],
    ["kbv", "KBV (Börsenwert / EK)", v => v == null ? "n. v." : f2.format(v) + "x", null],
    ["ktbv", "Kurs / materieller Buchwert", v => v == null ? "n. v." : f2.format(v) + "x", null],
    ["div_rendite", "Dividendenrendite (12M)", v => pct(v, 1), true],
    ["ausschuettung", "Ausschüttungsquote", v => pct(v, 0), null]]],
  ["Rentabilität (GuV)", [
    ["roe", "Eigenkapitalrendite RoE", v => pct(v, 1), true],
    ["rote", "RoTE (mat. EK)", v => pct(v, 1), true],
    ["roa", "Gesamtkapitalrendite RoA", v => pct(v, 2), true],
    ["cir", "Cost-Income-Ratio", v => pct(v, 1), false],
    ["vst_marge", "Vorsteuermarge", v => pct(v, 1), true],
    ["steuerquote", "Steuerquote", v => pct(v, 1), null],
    ["zinsanteil", "Zinsüberschuss in % Erträge", v => pct(v, 0), null],
    ["zinsmarge", "Zinsmarge (ZÜ / Ø Bilanzsumme)", v => pct(v, 2), true]]],
  ["Bilanz", [
    ["ek_quote", "Eigenkapitalquote", v => pct(v, 1), true],
    ["kredit_anteil", "Kredite in % Bilanzsumme", v => pct(v, 0), null],
    ["goodwill_ek", "Goodwill/Immat. in % EK", v => pct(v, 0), false]]],
  ["Wachstum zum Vorjahr", [
    ["w_ertraege", "Erträge", v => chg(v), true],
    ["w_jue", "Konzernergebnis", v => chg(v), true],
    ["w_eps", "Ergebnis je Aktie", v => chg(v), true],
    ["w_bilanzsumme", "Bilanzsumme", v => chg(v), null]]],
];
const MKZ_FLACH = Object.fromEntries(MKZ.flatMap(([, l]) => l.map(([k, n, f, hoch]) => [k, { n, f, hoch }])));
let mktRang = "rote";
const kzVon = (w, k) => w.kz ? w.kz[k] : null;
const mioB = v => v == null ? "n. v." : f0.format(v / 1e6);

function kennzahlenTabelle(liste) {
  const kopf = `<tr><th style="text-align:left">Kennzahl</th>${liste.map(w => `<th class="click" data-mkt="${w.ticker}" title="${esc(w.mutter || w.bank)}" style="${w.ticker === mktMarkiert ? "color:var(--key)" : ""}">${w.ticker.replace(/\.\w+$/, "")}${w.ebene === "Mutter" ? "*" : ""}</th>`).join("")}<th>Median</th></tr>`;
  const gr = (titel) => `<tr><td colspan="${liste.length + 2}" class="grp">${titel}</td></tr>`;
  let rows = gr("Größe (Mio., Bilanzwährung)") + [["ertraege", "Erträge"], ["jue", "Konzernergebnis"], ["bilanzsumme", "Bilanzsumme"]].map(([k, n]) =>
    `<tr><td>${n}</td>${liste.map(w => { const a = (w.abschluesse || [])[0] || {}; return `<td${a[k] == null ? ' class="n"' : ""}>${mioB(a[k])}</td>`; }).join("")}<td class="n">–</td></tr>`).join("");
  rows += `<tr><td class="n">Geschäftsjahr · Währung</td>${liste.map(w => `<td class="n">${w.kz && w.kz.gj || "–"} · ${w.bilanzwaehrung || ""}</td>`).join("")}<td></td></tr>`;
  MKZ.forEach(([titel, kz]) => {
    rows += gr(titel);
    kz.forEach(([k, n, f, hoch]) => {
      const v = liste.map(w => kzVon(w, k)), ok = v.filter(x => x != null);
      const best = ok.length > 2 && hoch != null ? (hoch ? Math.max(...ok) : Math.min(...ok)) : null;
      const schlecht = ok.length > 2 && hoch != null ? (hoch ? Math.min(...ok) : Math.max(...ok)) : null;
      rows += `<tr class="click" data-rang="${k}"><td>${n}</td>${v.map(x => `<td class="${x == null ? "n" : x === best ? "pos" : x === schlecht ? "neg" : ""}">${f(x)}</td>`).join("")}<td style="color:var(--amber)">${f(median(ok))}</td></tr>`;
    });
  });
  return `<div class="scroll"><table class="kzt"><thead>${kopf}</thead><tbody>${rows}</tbody></table></div>`;
}

function rangBalken(k, liste) {
  const def = MKZ_FLACH[k], z = liste.map(w => ({ w, v: kzVon(w, k) })).filter(x => x.v != null).sort((a, b) => b.v - a.v);
  if (!z.length) return `<p class="n">Keine Werte.</p>`;
  const W = 520, x0 = 150, x1 = W - 70, hz = 18, H = z.length * hz + 6;
  const lo = Math.min(0, ...z.map(x => x.v)), hi = Math.max(0, ...z.map(x => x.v));
  const sx = v => x0 + (x1 - x0) * (v - lo) / ((hi - lo) || 1), md = median(z.map(x => x.v));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  s += `<line x1="${sx(0)}" x2="${sx(0)}" y1="0" y2="${H}" stroke="var(--ink-3)"/>`;
  z.forEach(({ w, v }, i) => {
    const y = i * hz + 2, an = w.ticker === mktMarkiert, a = Math.min(sx(0), sx(v)), b = Math.max(sx(0), sx(v));
    s += `<text x="${x0 - 6}" y="${y + hz / 2}" text-anchor="end" dominant-baseline="middle" style="fill:${an ? "var(--amber)" : "var(--ink-2)"}">${esc(w.ticker.replace(/\.\w+$/, ""))}${w.ebene === "Mutter" ? "*" : ""} ${esc(kurz(w.mutter || w.bank).slice(0, 12))}</text>`;
    s += `<rect x="${a}" y="${y + 3}" width="${Math.max(1, b - a)}" height="${hz - 7}" fill="${an ? "var(--amber)" : v < 0 ? "var(--down)" : "var(--s3)"}" data-mkt="${w.ticker}" style="cursor:pointer" data-tip="${esc(`<b>${esc(w.mutter || w.bank)}</b>\n${def.n}: ${def.f(v)}\nMedian: ${def.f(md)}`)}"/>`;
    s += `<text x="${x1 + 6}" y="${y + hz / 2}" dominant-baseline="middle" style="fill:var(--ink)">${def.f(v)}</text>`;
  });
  s += `<line x1="${sx(md)}" x2="${sx(md)}" y1="0" y2="${H}" stroke="var(--amber)" stroke-dasharray="3 3"/>`;
  return s + "</svg>";
}

function bewertungsStreu(liste) {
  const pts = liste.filter(w => kzVon(w, "rote") != null && kzVon(w, "ktbv") != null);
  if (pts.length < 3) return `<p class="n">Zu wenige Werte.</p>`;
  const W = 520, H = 340, x0 = 46, x1 = W - 14, y0 = 14, y1 = H - 30;
  const xs = pts.map(w => w.kz.rote), ys = pts.map(w => w.kz.ktbv);
  const lx = Math.min(0, ...xs), hx = Math.max(...xs) * 1.08, hy = Math.max(...ys) * 1.1;
  const sx = v => x0 + (x1 - x0) * (v - lx) / (hx - lx), sy = v => y1 - (y1 - y0) * v / hy;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  niceTicks(lx, hx, 6).forEach(t => s += `<line class="gl" x1="${sx(t)}" x2="${sx(t)}" y1="${y0}" y2="${y1}"/><text x="${sx(t)}" y="${y1 + 14}" text-anchor="middle">${f0.format(t * 100)} %</text>`);
  niceTicks(0, hy, 5).forEach(t => s += `<line class="gl" x1="${x0}" x2="${x1}" y1="${sy(t)}" y2="${sy(t)}"/><text x="${x0 - 6}" y="${sy(t)}" text-anchor="end" dominant-baseline="middle">${f1.format(t)}x</text>`);
  s += `<line x1="${x0}" x2="${x1}" y1="${sy(1)}" y2="${sy(1)}" stroke="var(--ink-3)" stroke-dasharray="2 3"/>`;
  // Regressionsgerade KTBV = a + b · RoTE
  const n = pts.length, mx = sum(xs) / n, my = sum(ys) / n;
  const bb = sum(xs.map((x, i) => (x - mx) * (ys[i] - my))) / (sum(xs.map(x => (x - mx) ** 2)) || 1), aa = my - bb * mx;
  const ya = aa + bb * lx, yb = aa + bb * hx;
  s += `<line x1="${sx(lx)}" x2="${sx(hx)}" y1="${sy(ya)}" y2="${sy(yb)}" stroke="var(--amber-dim)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  pts.forEach(w => {
    const an = w.ticker === mktMarkiert, x = sx(w.kz.rote), y = sy(w.kz.ktbv);
    s += `<circle cx="${x}" cy="${y}" r="${an ? 6 : 4.5}" fill="${an ? "var(--amber)" : w.ebene === "Institut" ? "var(--ink)" : "var(--s3)"}" stroke="var(--panel)" stroke-width="1.5" data-mkt="${w.ticker}" style="cursor:pointer" data-tip="${esc(`<b>${esc(w.mutter || w.bank)}</b>\nRoTE ${pct(w.kz.rote, 1)} · Kurs/mat. BW ${f2.format(w.kz.ktbv)}x\nüber/unter Linie: ${(w.kz.ktbv - (aa + bb * w.kz.rote) >= 0 ? "+" : "") + f2.format(w.kz.ktbv - (aa + bb * w.kz.rote))}x`)}"/>`;
    s += `<text x="${x + 7}" y="${y}" dominant-baseline="middle" style="fill:${an ? "var(--amber)" : "var(--ink-2)"};pointer-events:none;font-size:9.5px">${w.ticker.replace(/\.\w+$/, "")}</text>`;
  });
  s += `<text x="${x1}" y="${H - 2}" text-anchor="end" style="fill:var(--amber)">RoTE →</text><text x="${x0}" y="${y0 - 4}" style="fill:var(--amber)">↑ Kurs / materieller Buchwert</text>`;
  return s + "</svg>";
}

function kennzahlenPanels(liste) {
  const mitKz = liste.filter(w => w.kz && w.kz.gj);
  const toggle = `<div class="ctrl" style="margin-bottom:12px"><button type="button" data-muetter="1" aria-pressed="${mktMuetter}">inkl. Muttergesellschaften (Peergroup)</button></div>`;
  const wahl = `<div class="ctrl" style="margin-bottom:12px">${["kgv", "kbv", "div_rendite", "roe", "rote", "cir", "zinsmarge", "ek_quote", "w_jue"].map(k => `<button type="button" data-rang="${k}" aria-pressed="${k === mktRang}">${MKZ_FLACH[k].n.split(" (")[0]}</button>`).join("")}</div>`;
  return `${panel({ code: "MKT 3", titel: "Kennzahlenvergleich Bilanz & GuV", sub: "letztes Geschäftsjahr, Konzern · grün = bester, rot = schwächster Wert der Zeile (Bewertung ohne Wertung) · Zeile wählt Kennzahl für MKT 4", breite: "w7", body: toggle + kennzahlenTabelle(mitKz),
      fuss: "Konzernabschlüsse (meist IFRS/US-GAAP) laut Yahoo Finance, nicht die HGB-Einzelabschlüsse der übrigen Ansichten. * = nur die Muttergesellschaft ist notiert. RoE/RoTE/RoA auf Ø Kapital aus Vor- und Berichtsjahr; Cost-Income-Ratio = Verwaltungsaufwand / Erträge (bei US-Banken Summe der Non-Interest-Expense-Posten, ohne Risikovorsorge). Türkische Banken bilanzieren unter Hochinflation (IAS 29). Yahoo-Posten sind nicht geprüft; offensichtlich unplausible Werte (negativer Zinsüberschuss, CIR außerhalb 0–150 %) sind ausgeblendet." })}
    <div class="col w5">${panel({ code: "MKT 4", titel: "Rangfolge", sub: `${MKZ_FLACH[mktRang].n} · gestrichelt = Median`, body: wahl + rangBalken(mktRang, mitKz) })}
    ${panel({ code: "MKT 5", titel: "Bewertung gegen Rentabilität", sub: "Kurs / materieller Buchwert gegen RoTE · gestrichelt = Regressionsgerade", body: bewertungsStreu(mitKz),
      fuss: "Punkte über der Geraden sind gemessen an ihrer Rentabilität teurer bewertet als die Vergleichsgruppe, Punkte darunter günstiger. Weiß = Bank selbst notiert, grau = Mutter." })}</div>`;
}

function quotes() {
  const el = document.getElementById("quotes");
  if (!MARKT || !MARKT.werte.length) { el.hidden = true; document.getElementById("key-mkt").hidden = !MARKT; return; }
  const stand = eindeutig().reduce((m, w) => w.datum > m ? w.datum : m, "");
  el.innerHTML = `<span class="ql">Schluss ${stand.split("-").reverse().join(".")}</span>` + eindeutig().filter(w => w.ebene === "Institut").concat(eindeutig().filter(w => w.ebene !== "Institut"))
    .map(w => `<a href="#mkt" data-mkt="${w.ticker}"><b>${w.ticker}</b> ${kursF(w.kurs, w.waehrung)} <span class="${klasse(w.r_1t)}">${chg(w.r_1t)}</span></a>`).join("");
}

/* ---------- Ticker ---------- */
function tape() {
  document.getElementById("tape").innerHTML = GRUPPEN.map(g => {
    const b = inGruppe(g.id), m = k => median(vals(b, k));
    const st = (n, v) => `<div><span>${n}</span><strong>${v}</strong></div>`;
    return `<div style="--gf:${g.farbe}"><div class="g"><b>${g.kurz}</b>${g.id}<span>n = ${b.length} · Median</span></div>
      <div class="stats">${st("CET1", pct(m("cet1_quote"), 1))}${st("Leverage", pct(m("lr"), 1))}${st("EK+F/BS", pct(m("ek_fonds_quote"), 1))}${st("RWA/BS", pct(m("rwa_dichte"), 0))}</div></div>`;
  }).join("");
}

/* ---------- Routing & Ereignisse ---------- */
const VIEWS = { grp: viewGrp, quot: viewQuot, cmp: viewCmp, rank: viewRank, mkt: viewMkt };
let aktuell = "grp";
function render() {
  const h = location.hash.slice(1);
  aktuell = VIEWS[h] ? h : "grp";
  document.querySelectorAll(".key").forEach(k => k.dataset.v === aktuell ? k.setAttribute("aria-current", "page") : k.removeAttribute("aria-current"));
  document.getElementById("view").innerHTML = VIEWS[aktuell]();
  const add = document.getElementById("cmpadd");
  if (add) add.addEventListener("change", () => { bankDazu(add.value); });
}
function gehe(v) { if (location.hash === "#" + v) render(); else location.hash = v; }
function bankFinden(q) { q = q.trim().toLowerCase(); if (!q) return null; return BANKEN.find(b => b.bank.toLowerCase() === q) || BANKEN.find(b => b.bank.toLowerCase().includes(q)); }
function bankDazu(name) {
  const b = bankFinden(name); if (!b) return;
  if (auswahl === null) viewCmp();
  if (!auswahl.includes(b.bank)) { auswahl.push(b.bank); if (auswahl.length > 6) auswahl.shift(); }
  gehe("cmp");
}
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-strip]")) { quotKz = t.closest("[data-strip]").dataset.strip; render(); }
  else if (t.closest("[data-sx]")) { streuX = t.closest("[data-sx]").dataset.sx; render(); }
  else if (t.closest("[data-sy]")) { streuY = t.closest("[data-sy]").dataset.sy; render(); }
  else if (t.closest("[data-rg]")) { rankGruppe = t.closest("[data-rg]").dataset.rg; render(); }
  else if (t.closest("[data-sort]")) { const k = t.closest("[data-sort]").dataset.sort; rankSort = { k, ab: rankSort.k === k ? !rankSort.ab : true }; render(); }
  else if (t.closest("[data-weg]")) { const n = t.closest("[data-weg]").dataset.weg; auswahl = auswahl.filter(x => x !== n); render(); }
  else if (t.closest("[data-fenster]")) { mktFenster = t.closest("[data-fenster]").dataset.fenster; render(); }
  else if (t.closest("[data-muetter]")) { mktMuetter = !mktMuetter; render(); }
  else if (t.closest("[data-rang]")) { mktRang = t.closest("[data-rang]").dataset.rang; render(); }
  else if (t.closest("[data-mkt]")) { mktMarkiert = t.closest("[data-mkt]").dataset.mkt; if (t.closest(".quotes")) e.preventDefault(); gehe("mkt"); }
  else if (t.closest("[data-bank]")) { bankDazu(t.closest("[data-bank]").dataset.bank); }
});
document.getElementById("cmd").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const v = e.target.value.trim(), c = v.toLowerCase().replace(/\s*<?go>?$/, "");
  e.target.value = "";
  if (VIEWS[c]) gehe(c); else bankDazu(v);
});
document.addEventListener("keydown", e => {
  const m = { F1: "grp", F2: "quot", F3: "cmp", F4: "rank", F5: "mkt" }[e.key];
  if (m) { e.preventDefault(); gehe(m); }
});
addEventListener("hashchange", render);

/* ---------- Start ---------- */
async function start() {
  const el = document.getElementById("daten");
  try { DATA = JSON.parse(el.textContent); } catch { DATA = await (await fetch("../data/banken.json")).json(); }
  try { MARKT = JSON.parse(document.getElementById("markt").textContent); } catch { try { MARKT = await (await fetch("../data/markt.json")).json(); } catch { MARKT = null; } }
  BANKEN = DATA.banken.filter(b => G[b.gruppe]).map(abgeleitet);
  document.getElementById("meta").textContent = `${BANKEN.length} Institute · Stichtag ${DATA.meta.stichtag.split("-").reverse().join(".")} · Beträge Mio. €`;
  document.getElementById("banklist").innerHTML = BANKEN.map(b => `<option value="${esc(b.bank)}">`).join("");
  tape();
  quotes();
  render();
}
start();
</script>
