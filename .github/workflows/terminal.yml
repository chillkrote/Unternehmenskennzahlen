name: Terminal bauen

# Baut app/dist/bankterminal.html aus dem Stand von main. Das Ergebnis wird NICHT mehr nach main committet
# (8,6 MB pro Commit, doppelt, mehrmals täglich bliesen das Repo auf), sondern
#  - als Workflow-Artifact "terminal" abgelegt (14 Tage) und
#  - auf den Branch "terminal-dist" geschrieben, immer als ein einziger Commit (Force-Push, keine Historie).
# Auslöser: die Daten-Workflows rufen diesen Lauf nur auf, wenn sich Daten geändert haben; dazu Änderungen am Terminal-Code
# und von Hand. Pull Requests bauen nur zur Prüfung.
on:
  workflow_dispatch:
  push:
    branches: [main, codex/europe600-abschluesse]
    paths: ["app/src/**", "app/tests/**", "app/*.py", "app/unternehmen_katalog.json", "europa/**", ".github/workflows/terminal.yml"]
  pull_request:
    paths: ["app/src/**", "app/*.py", "app/unternehmen_katalog.json", ".github/workflows/terminal.yml", ".github/scripts/pdf_platzhalter.py"]

permissions:
  contents: write

concurrency:
  group: terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !*.pdf
            !*.gz
          sparse-checkout-cone-mode: false
      - name: Platzhalter für ausgelassene PDFs (Dateigrößen für die Dokumentlisten)
        run: python3 .github/scripts/pdf_platzhalter.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install openpyxl
      - run: python3 app/build.py
      - run: python3 -m unittest discover -s europa -p 'test_*.py'
      - name: Länderauswahl in allen Reitern prüfen
        run: |
          npm install --prefix /tmp/terminal-tests --no-save playwright
          /tmp/terminal-tests/node_modules/.bin/playwright install --with-deps chromium --only-shell
          NODE_PATH=/tmp/terminal-tests/node_modules node app/tests/country-smoke.js app/dist/bankterminal.html
      - uses: actions/upload-artifact@v4
        with:
          name: terminal
          path: app/dist/bankterminal.html
          retention-days: 14
          compression-level: 9
      - name: Auf Branch terminal-dist veröffentlichen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=$(mktemp -d)
          cp app/dist/bankterminal.html app/dist/bankterminal.fragment.html "$d"/
          cd "$d"
          git init -q -b terminal-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Terminal-Build $(date -u +%Y-%m-%dT%H:%MZ) aus ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" terminal-dist
      - name: Zusammenfassung
        run: |
          echo "### Terminal gebaut" >> "$GITHUB_STEP_SUMMARY"
          echo "$(du -h app/dist/bankterminal.html | cut -f1) aus Stand ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

