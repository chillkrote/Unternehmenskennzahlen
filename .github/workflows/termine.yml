name: Berichtstermine

# Daten-Update, kein Terminal-Bau (den übernimmt terminal.yml, nur wenn sich etwas geändert hat).
#  05:17 UTC täglich, 16:47 UTC Mo-Fr (vor und nach der Veröffentlichungswelle):
#  1. montags (und von Hand) die Finanzkalender der Unternehmen lesen (termine/skripte/finanzkalender_scan.py)
#  2. Termine aus Yahoo Finance, Finanzkalender und termine_manuell.csv zusammenführen (termine/termine.csv)
#  3. fällige Berichte von den Unternehmenswebsites laden (PDF nach <branche>/dokumente/<id>/, index.csv-Eintrag, SHA-256);
#     ohne fällige Termine endet der Schritt nach Sekunden
# Teilausfälle (einzelne Seiten, Yahoo 429) lassen den Lauf nicht scheitern; die Zusammenfassung zeigt, was fehlte.
# Kosten: keine (Actions-Kontingent; yfinance und Unternehmenswebsites sind frei zugänglich).
on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "47 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# gemeinsame Sperre mit marktdaten.yml: nie zwei Läufe gleichzeitig am Daten-Branch
concurrency:
  group: daten-schreiben
  cancel-in-progress: false

defaults:
  run:
    shell: bash   # mit pipefail: ein Fehler vor "| tee" bricht den Schritt ab

jobs:
  termine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Originaldokumente (PDF, 2,9 GB) werden nicht gebraucht; neue PDFs legt der Abruf neu an. index.csv-Dateien sind ausgecheckt.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !*.pdf
            !*.gz
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: termine/requirements.txt
      - run: pip install -r termine/requirements.txt
      - name: Finanzkalender lesen (montags)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 termine/skripte/finanzkalender_scan.py 2>&1 | tee /tmp/scan.log || echo "::warning::Finanzkalender-Scan fehlgeschlagen, weiter mit vorhandenem Stand"
          fi
      - name: Termine erfassen
        run: python3 termine/skripte/termine_erfassen.py 2>&1 | tee /tmp/erfassen.log
      - name: Fällige Berichte abrufen
        run: python3 termine/skripte/berichte_abrufen.py 2>&1 | tee /tmp/abruf.log
      - name: Zusammenfassung
        if: always()
        continue-on-error: true
        run: |
          {
            echo "### Berichtstermine"
            for f in erfassen abruf scan; do
              [ -f /tmp/$f.log ] || continue
              echo "**$f**"; echo '```'; tail -n 8 /tmp/$f.log || true; echo '```'
            done
            echo "Neu geladen: $(grep -c '^OK ' /tmp/abruf.log 2>/dev/null || true), nicht gefunden/offen: $(grep -c '^-- ' /tmp/abruf.log 2>/dev/null || true)"
          } >> "$GITHUB_STEP_SUMMARY"
      # Schreiben nur auf main: ein Start von einem anderen Branch ist ein Trockenlauf (Abruf und Zusammenfassung, kein Commit)
      - name: Änderungen pushen
        id: push
        if: github.ref == 'refs/heads/main'
        # Dateien über 100 MB lehnt GitHub ab; der Abruf speichert sie nicht (termine/rohdaten/zu_gross.txt)
        run: .github/scripts/daten_pushen.sh "Berichtstermine und neue Berichte $(date -u +%Y-%m-%d)" termine boersennotierte-unternehmen banken
      - name: Terminal neu bauen lassen
        if: github.ref == 'refs/heads/main' && steps.push.outputs.geaendert == 'true'
        run: gh workflow run terminal.yml --ref "$GITHUB_REF_NAME"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
